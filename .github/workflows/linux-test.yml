# Installiert die veröffentlichten Linux-Pakete auf mehreren Distributionen und startet die App.
name: Linux smoke test

on:
  workflow_dispatch:
    inputs:
      source:
        description: "release = published files, build = build the .deb/.tar.gz from main first"
        default: release

permissions:
  contents: read

jobs:
  build:
    if: inputs.source == 'build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev && ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/VertexForge-Studio-linux-*
  deb:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.source == 'build'
        with:
          name: linux-build
      - name: Download and verify
        if: inputs.source != 'build'
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --pattern 'SHA256SUMS.txt'
          grep amd64.deb SHA256SUMS.txt | sha256sum -c -
      - name: Install the .deb like a user
        run: sudo apt-get update -q && sudo apt-get install -y ./VertexForge-Studio-linux-amd64.deb xvfb imagemagick
      - name: Start the app
        run: |
          Xvfb :9 -screen 0 1440x900x24 & sleep 2
          DISPLAY=:9 vertexforge-studio > run1.txt 2>&1 & sleep 25
          top -b -n1 | grep -E "WebKitW|vertexfo" || true
          DISPLAY=:9 import -window root shot-a-${{ matrix.os }}.png
          pkill -f vertexforge-studio; sleep 2; cat run1.txt
          echo "---- with VF_DEBUG=1 (console output) ----"
          DISPLAY=:9 VF_DEBUG=1 vertexforge-studio > run2.txt 2>&1 & sleep 25
          cat run2.txt; DISPLAY=:9 import -window root shot-b-${{ matrix.os }}.png; pkill -f vertexforge-studio; sleep 2
          dpkg -l | grep -iE "gstreamer|gst-plugins|libgl1|mesa|fonts-" | awk '{print $2}' | tr '\n' ' '; echo
          sudo apt-get install -y -q libgl1-mesa-dri libegl-mesa0 > mesa.txt 2>&1 || true; grep -E "^(Setting up|The following NEW)" -A3 mesa.txt | head -20
          DISPLAY=:9 vertexforge-studio > run4.txt 2>&1 & sleep 25
          DISPLAY=:9 import -window root shot-d-mesa-${{ matrix.os }}.png
          curl -s http://127.0.0.1:47821/vf-ping; echo
          cat ~/.local/share/vertexforge-studio/vertexforge.log
          pgrep -f vertexforge-studio || { echo "APP NOT RUNNING"; exit 1; }
          DISPLAY=:9 import -window root shot-${{ matrix.os }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.os }}
          path: shot-*.png
  fedora:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.source == 'build'
        with:
          name: linux-build
      - name: Install from the .tar.gz
        run: |
          dnf install -y -q webkit2gtk4.1 xorg-x11-server-Xvfb ImageMagick curl tar procps-ng
          [ -f VertexForge-Studio-linux-x86_64.tar.gz ] || curl -sL -o VertexForge-Studio-linux-x86_64.tar.gz https://github.com/${{ github.repository }}/releases/latest/download/VertexForge-Studio-linux-x86_64.tar.gz
          tar xzf VertexForge-Studio-linux-x86_64.tar.gz && cd VertexForge-Studio-linux-x86_64 && ./install.sh
      - name: Start the app
        run: |
          Xvfb :9 -screen 0 1440x900x24 & sleep 2
          DISPLAY=:9 ~/.local/bin/vertexforge-studio & sleep 25
          top -b -n1 | grep -E "WebKitW|vertexfo" || true
          curl -s http://127.0.0.1:47821/vf-ping; echo
          cat ~/.local/share/vertexforge-studio/vertexforge.log
          DISPLAY=:9 import -window root shot-fedora.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-fedora
          path: shot-*.png
