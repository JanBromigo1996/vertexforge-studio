# Baut bei jedem Versions-Tag (z. B. v2.3.0) App, Installer und Browser-Version,
# prüft alles mit ClamAV (und optional VirusTotal) und veröffentlicht ein GitHub-Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Build app, uninstaller and setup
        run: ./build_windows.sh

      - name: Virus scan (ClamAV) – the release fails if anything is found
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          cd dist
          clamscan --scan-pe=yes --heuristic-alerts=yes --alert-broken=yes \
            VertexForge-Studio-Setup.exe VertexForge-Studio.exe Uninstall-VertexForge-Studio.exe \
            WebView2Loader.dll VertexForge-Studio-Portable.zip VertexForge-Studio-Browser.html | tee clamscan.txt
          grep -q "Infected files: 0" clamscan.txt

      - name: Checksums
        run: |
          cd dist
          sha256sum VertexForge-Studio-Setup.exe VertexForge-Studio.exe Uninstall-VertexForge-Studio.exe \
            WebView2Loader.dll VertexForge-Studio-Portable.zip VertexForge-Studio-Browser.html | tee SHA256SUMS.txt

      - name: Publish release (notes from RELEASE_NOTES.md)
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/VertexForge-Studio-Setup.exe
            dist/VertexForge-Studio-Portable.zip
            dist/VertexForge-Studio-Browser.html
            dist/SHA256SUMS.txt
            dist/clamscan.txt

      # VirusTotal: every result (including false alarms) is appended to the release notes.
      - name: VirusTotal scan (optional, needs the VT_API_KEY secret)
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            dist/VertexForge-Studio-Setup.exe
            dist/VertexForge-Studio.exe
            dist/Uninstall-VertexForge-Studio.exe
            dist/VertexForge-Studio-Portable.zip
