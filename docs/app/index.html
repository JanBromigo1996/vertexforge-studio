  background-size:calc(var(--g,24px)*.5) calc(var(--g,24px)*.5),100% 100%,100% 100%;box-shadow:inset 0 0 0 10px #4a3826,inset 0 0 0 12px #2c2016,inset 0 0 140px rgba(0,0,0,.45)}
/* Linienfarben passend zum Hintergrund */
.viewport.bg-cork .wire,.viewport.bg-cork .wire-temp{stroke:#b3261e;stroke-width:2.4;opacity:.92}
.viewport.bg-cork .arrow-head{fill:#b3261e}
.viewport.bg-blueprint .wire,.viewport.bg-blueprint .wire-temp{stroke:#e8f1ff;opacity:.85}
.viewport.bg-blueprint .arrow-head{fill:#e8f1ff}
.viewport.bg-chalk .wire,.viewport.bg-chalk .wire-temp{stroke:#efece1;opacity:.8;stroke-dasharray:1 0}
.viewport.bg-chalk .arrow-head{fill:#efece1}
.viewport.bg-paper .wire,.viewport.bg-paper .wire-temp{stroke:#4a3a28}
.viewport.bg-paper .arrow-head{fill:#4a3a28}
.viewport:is(.bg-cork,.bg-paper) .wire-label .wl-text{background:#fbf6ea;border-color:rgba(60,40,10,.25);color:#3a2e1e;box-shadow:0 2px 6px rgba(40,20,0,.25)}
.viewport.bg-blueprint .wire-label .wl-text{background:#1c4677;border-color:rgba(230,240,255,.6);color:#eef5ff;font-family:var(--mono)}
.viewport.bg-chalk .wire-label .wl-text{background:#27312d;border-color:rgba(240,238,228,.5);color:#f1efe6;font-family:'Caveat',cursive;font-size:14px}

/* Knoten-Stil „Notizzettel“ (klassische Pinnwand) */
.ns-sticky .node:is(.node-mindmap,.node-card,.node-note){--panel:#f6e48e;--panel-2:rgba(255,255,255,.45);--bg-2:rgba(255,255,255,.35);--text:#2a2418;--text-2:#5a4b30;--muted:#86744d;--line:rgba(60,40,0,.10);--line-2:rgba(60,40,0,.18);--hover:rgba(60,40,0,.06);--active:rgba(60,40,0,.1);--accent:#8a5a1c;--nacc:#8a5a1c;--on-accent:#fff8e8;
  background:var(--panel);border:none;border-radius:2px;box-shadow:0 14px 22px -6px rgba(40,20,0,.45),0 2px 3px rgba(40,20,0,.25)}
.ns-sticky .node.node-card{--panel:#fbf8ef;--panel-2:#fffdf6}
.ns-sticky .node.node-note{--panel:var(--note-bg,#ffc9b8);--note-ink:#3a2418}
.ns-sticky .node:is(.node-mindmap,.node-card,.node-note,.node-image,.node-video,.node-file):nth-child(3n+1){rotate:-1.4deg}
.ns-sticky .node:is(.node-mindmap,.node-card,.node-note,.node-image,.node-video,.node-file):nth-child(3n+2){rotate:1.1deg}
.ns-sticky .node:is(.node-mindmap,.node-card,.node-note,.node-image,.node-video,.node-file).selected,.ns-sticky .node.lifting{rotate:0deg}
.ns-sticky .node:is(.node-mindmap,.node-card,.node-note,.node-image,.node-video,.node-file):not(.docked)::before{content:"";position:absolute;left:50%;top:-8px;width:15px;height:15px;margin-left:-7px;border-radius:50%;z-index:3;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#ff8a7a,#c62a1d 55%,#7e140c);box-shadow:0 3px 4px rgba(0,0,0,.4)}
.ns-sticky .node:is(.node-mindmap,.node-card,.node-note) .node-grip{border-top:none;border-bottom-color:transparent;color:var(--muted)}
.ns-sticky .node:is(.node-image,.node-video,.node-file){background:#fbfaf5;border:none;border-radius:2px;padding:8px 8px 0;box-shadow:0 14px 22px -6px rgba(40,20,0,.45),0 2px 3px rgba(40,20,0,.25);--text:#2a2418;--muted:#86744d;--line:rgba(0,0,0,.08)}
.ns-sticky .node:is(.node-image,.node-video,.node-file) .node-grip{background:transparent;color:#9a8a68;border-bottom:none;height:16px}
.ns-sticky .node.selected{box-shadow:0 0 0 2px #fff,0 0 0 4px #b3261e,0 14px 22px -6px rgba(40,20,0,.45)}
/* „Karteikarte“ */
.ns-index .node:is(.node-mindmap,.node-card,.node-note){--panel:#fdfcf7;--panel-2:#f4f1e8;--bg-2:#f4f1e8;--text:#22262e;--text-2:#4b5361;--muted:#8b93a1;--line:rgba(40,70,120,.14);--line-2:rgba(40,70,120,.24);--hover:rgba(40,70,120,.06);--active:rgba(40,70,120,.1);--accent:#a8433e;--nacc:#a8433e;--on-accent:#fff;
  background:#fdfcf7;border:1px solid #e3ddd0;border-radius:3px;box-shadow:0 8px 18px -8px rgba(60,40,10,.35),0 1px 2px rgba(60,40,10,.15)}
.ns-index .node:is(.node-mindmap,.node-card,.node-note) .node-grip{border-top:3px solid #d9534f;border-bottom:1px solid rgba(217,83,79,.35);color:#9a5a58}
.ns-index .node:is(.node-mindmap,.node-card) .node-body{background:repeating-linear-gradient(transparent 0 21px,rgba(70,110,170,.16) 21px 22px)}
.ns-index .node.node-note{background:var(--note-bg,#fff6c9)}
/* „Blaupause“ */
.ns-blueprint .node:is(.node-mindmap,.node-card,.node-note){--panel:transparent;--panel-2:rgba(255,255,255,.06);--text:#eef5ff;--text-2:#c6d8f1;--muted:#9db7da;--line:rgba(220,235,255,.25);--line-2:rgba(220,235,255,.4);--hover:rgba(255,255,255,.07);--nacc:#eef5ff;
  background:rgba(20,60,110,.35);border:1.5px solid rgba(230,240,255,.8);border-radius:2px;box-shadow:none}
.ns-blueprint .node .node-grip{border-top:none;border-bottom:1px dashed rgba(230,240,255,.45);color:#cfe0f7}
.ns-blueprint .node .n-title,.ns-blueprint .node .n-cat{font-family:var(--mono)}
.ns-blueprint .node.node-note .n-note{color:#eef5ff;font-family:var(--mono);font-size:13px}
/* „Kreide“ */
.ns-chalk .node:is(.node-mindmap,.node-card,.node-note){--panel:transparent;--panel-2:rgba(255,255,255,.05);--text:#f3f1e8;--text-2:#d9d6c8;--muted:#aaa797;--line:rgba(240,238,228,.25);--line-2:rgba(240,238,228,.45);--hover:rgba(255,255,255,.06);--nacc:#f3d97a;
  background:rgba(255,255,255,.02);border:2px solid rgba(240,238,228,.7);border-radius:12px 9px 14px 8px;box-shadow:none}
.ns-chalk .node :is(.n-title,.n-desc,.n-note,.n-cat){font-family:'Caveat','Patrick Hand',cursive;font-size:1.25em;letter-spacing:.2px}
.ns-chalk .node .node-grip{border-top:none;border-bottom:1px solid rgba(240,238,228,.2);color:#cfccbe}
/* „Glas“ */
.ns-glass .node:is(.node-mindmap,.node-card,.node-note){background:color-mix(in srgb,var(--panel) 55%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid color-mix(in srgb,var(--text) 14%,transparent);border-radius:14px}
.ns-glass .node .node-grip{border-radius:14px 14px 0 0}

/* Medien-Knoten: Video & verknüpfte Dateien */
.node-video,.node-file{background:#0b0b0d;border-color:#2a2a30}
.node-video .node-grip,.node-file .node-grip{background:#141417;color:#8a867d;border-bottom-color:#26262b}
.node-vid{position:relative;background:#000}
.node-vid video,.file-prev video,.file-prev > img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.vid-badge{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--mono);font-size:10px;pointer-events:none;transition:opacity .2s}
.vid-badge .ic{fill:currentColor}
.node:hover .vid-badge{opacity:.35}
.vid-link{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;pointer-events:none}
.file-prev{position:relative;background:#101013}
.file-prev .file-tile{display:none}
.file-prev.nopreview > img,.file-prev.nopreview > video{display:none}
.file-prev.nopreview .file-tile{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--sw) 22%,transparent),transparent 70%)}
.file-tile b{min-width:64px;height:64px;padding:0 10px;border-radius:14px;display:grid;place-items:center;background:var(--sw);color:#fff;font-family:var(--mono);font-size:18px;box-shadow:0 10px 24px -8px var(--sw)}
.file-tile img{width:64px;height:64px;object-fit:contain}
.file-tile span{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:#9b978e}
.file-foot{display:flex;flex-direction:column;gap:2px;padding:0 0 6px;background:inherit}
.file-path{display:flex;align-items:center;gap:5px;padding:0 10px;font-family:var(--mono);font-size:10px;color:#8a867d;min-width:0}
.file-path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.file-path.missing{color:var(--danger)}
.file-acts{position:absolute;right:8px;top:30px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.node-file:hover .file-acts,.node-file.selected .file-acts{opacity:1}
.file-acts button{width:26px;height:26px;border-radius:6px;border:none;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;cursor:pointer}
.file-acts button:hover{background:var(--accent);color:var(--on-accent)}
.node-file .n-caption,.node-video .n-caption{flex-shrink:0}
/* Großansicht */
.lightbox{position:fixed;inset:0;z-index:2500;background:rgba(6,5,4,.88);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px;opacity:0;transition:opacity .18s;cursor:zoom-out}
.lightbox.open{opacity:1}
.lb-stage{max-width:100%;max-height:calc(100% - 40px);display:flex;transform:scale(.96);transition:transform .25s var(--ease)}
.lightbox.open .lb-stage{transform:none}
.lb-stage img,.lb-stage video{max-width:100%;max-height:calc(100vh - 120px);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);cursor:default}
.lb-cap{color:#ddd6c8;font-size:13px;display:flex;gap:12px;align-items:center}
.lb-cap span{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid #555;border-radius:4px;color:#999}

/* Design-Popover */
.design-pop{position:fixed;z-index:980;width:356px;max-height:min(560px,80vh);overflow:auto;padding:12px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .14s,transform .18s var(--ease)}
.design-pop.open{opacity:1;transform:none}
.dp-head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.dp-head .ic{color:var(--accent)}
.dp-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:12px 0 7px}
.dp-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dp-preset{display:flex;flex-direction:column;gap:5px;padding:4px;border:1px solid var(--line);border-radius:9px;background:transparent;cursor:pointer;transition:border-color .12s,transform .12s}
.dp-preset:hover{border-color:var(--line-2);transform:translateY(-1px)}
.dp-preset.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--acc-soft)}
.dp-preset em{font-style:normal;font-size:11px;color:var(--text-2);text-align:center}
.sw-prev{position:relative;height:54px;border-radius:6px;overflow:hidden;--g:12px;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:var(--g) var(--g)}
.sw-prev.bg-grid,.sw-prev.bg-cork,.sw-prev.bg-blueprint,.sw-prev.bg-paper,.sw-prev.bg-chalk,.sw-prev.bg-plain{box-shadow:none}
.sw-prev i{position:absolute;width:34%;height:34%;top:22%;left:14%;border-radius:3px;background:var(--panel);border:1px solid var(--line-2)}
.sw-prev i + i{left:54%;top:46%}
.sw-prev.ns-sticky i{background:#f6e48e;border:none;rotate:-3deg;box-shadow:0 3px 5px rgba(0,0,0,.3)}
.sw-prev.ns-sticky i + i{background:#fbf8ef;rotate:2deg}
.sw-prev.ns-index i{background:#fdfcf7;border:none;border-top:2px solid #d9534f}
.sw-prev.ns-blueprint i,.sw-prev.ns-chalk i{background:transparent;border:1.5px solid rgba(240,240,240,.8)}
.sw-prev.ns-chalk i{border-radius:6px 4px 7px 3px}
.sw-prev.ns-glass i{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);border-radius:6px}
.dp-chips{display:flex;flex-wrap:wrap;gap:5px}
.dp-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 5px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text-2);font-size:11.5px;cursor:pointer;transition:all .12s}
.dp-chip:hover{border-color:var(--line-2);color:var(--text)}
.dp-chip.on{border-color:var(--acc-line);background:var(--acc-soft);color:var(--accent)}
.chip-sw{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);--g:6px;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:6px 6px;box-shadow:none!important}
.chip-sw.ns-studio{background:var(--panel);border-top:3px solid var(--accent)}
.chip-sw.ns-sticky{background:#f6e48e}
.chip-sw.ns-index{background:#fdfcf7;border-top:3px solid #d9534f}
.chip-sw.ns-blueprint{background:#1c4677;border:1.5px solid #e8f1ff}
.chip-sw.ns-chalk{background:#27312d;border:1.5px solid #efece1}
.chip-sw.ns-glass{background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.05))}
.dp-note{margin-top:12px;font-size:11px;color:var(--muted)}
.dp-presets.papers{grid-template-columns:repeat(3,1fr);margin-top:8px}
.paper-prev{position:relative;height:64px;border-radius:5px;display:block;padding:8px 10px;overflow:hidden;text-align:left;border:1px solid var(--line)}
.paper-prev b{font-size:17px;font-weight:600}
.paper-prev i{display:block;height:3px;margin-top:6px;border-radius:2px;background:currentColor;opacity:.25;width:80%}
.paper-prev i + i{width:60%}

/* Story-Papiere */
.paper-parchment .paper{}
.paper-clean .paper{background:#fbfaf7;color:#22201c;font-family:var(--ui);box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 40px -16px rgba(0,0,0,.35)}
.paper-clean .paper :is(.paper-title,.paper-body){font-family:'Inter',system-ui,sans-serif;color:#22201c}
.paper-clean .paper .paper-body{font-size:16px;line-height:1.75}
.paper-manuscript .paper{background:#f6f0e2 repeating-linear-gradient(transparent 0 31px,rgba(70,110,170,.18) 31px 32px);color:#2b2620;border-left:3px double rgba(200,70,60,.45)}
.paper-manuscript .paper :is(.paper-title,.paper-body){font-family:'EB Garamond','Cormorant Garamond',Georgia,serif;color:#2b2620}
.paper-manuscript .paper .paper-body{font-size:19px;line-height:32px}
.paper-typewriter .paper{background:#f2ede1;color:#1f1d1a;box-shadow:0 1px 0 #fff inset,0 18px 40px -16px rgba(0,0,0,.45)}
.paper-typewriter .paper :is(.paper-title,.paper-body){font-family:'Courier Prime','Special Elite','Courier New',monospace;color:#1f1d1a}
.paper-typewriter .paper .paper-body{font-size:15px;line-height:1.8}
.paper-night .paper{background:#15161b;color:#d7d3c8;border-color:#26272e}
.paper-night .paper :is(.paper-title,.paper-body){color:#d7d3c8}
.paper-prev.paper-parchment{background:var(--paper);color:var(--paper-text);font-family:var(--serif)}
.paper-prev.paper-clean{background:#fbfaf7;color:#22201c}
.paper-prev.paper-manuscript{background:#f6f0e2 repeating-linear-gradient(transparent 0 9px,rgba(70,110,170,.25) 9px 10px);color:#2b2620;font-family:Georgia,serif}
.paper-prev.paper-typewriter{background:#f2ede1;color:#1f1d1a;font-family:'Courier Prime','Courier New',monospace}
.paper-prev.paper-night{background:#15161b;color:#d7d3c8}

/* Bereichs-Vollbild */
html.area-full .topbar,html.area-full .statusbar{display:none}
html.area-full .app{border:none}
.fs-hint{position:fixed;top:14px;left:50%;z-index:1500;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line-2);box-shadow:var(--shadow);font-size:12px;color:var(--text-2);opacity:0;transform:translate(-50%,-10px);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.fs-hint.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================================
   ECHTZEIT-ANIMATIONEN
   ============================================================================ */
/* Cover reagieren live auf die Maus (leichte 3D-Neigung + Lichtreflex) */
.pcard-cover{transform:perspective(900px) rotateZ(var(--rz,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0));transition:transform .45s var(--ease),box-shadow .3s}
.pcard-cover.tilting{transition:transform .08s linear,box-shadow .3s;--ty:-4px;box-shadow:0 26px 50px -12px rgba(0,0,0,.6)}
.pcard-cover::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.22),transparent 45%);mix-blend-mode:soft-light}
.pcard-cover.tilting::after{opacity:1}
/* Gezogene Elemente heben sich an */
.node{transition:box-shadow .18s ease,scale .18s var(--ease)}
.node.lifting{scale:1.018;box-shadow:0 28px 50px -14px rgba(0,0,0,.55),0 0 0 1px var(--acc-line);z-index:9000!important}
/* Fließende Verbindungen am ausgewählten Element */
.wire.flow{stroke-dasharray:7 7;animation:wireFlow .9s linear infinite;opacity:1}
@keyframes wireFlow{to{stroke-dashoffset:-14}}
/* Überfällige Fristen pulsieren dezent */
.cd.cd-overdue{animation:cdPulse 2.6s ease-in-out infinite}
@keyframes cdPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 22%,transparent)}}
/* Fortschrittsringe & Balken laufen beim Öffnen hoch */
.view.entering .ring .fg{animation:ringIn .8s var(--ease)}
@keyframes ringIn{from{stroke-dashoffset:var(--ring-c)}}
.view.entering .meter > div,.view.entering .pcard-progress > div,.view.entering .tl-bar{animation:growX .7s var(--ease)}
@keyframes growX{from{transform:scaleX(0)}}
.meter > div,.pcard-progress > div{transform-origin:left}
.tl-bar{transform-origin:left}
@media (prefers-reduced-motion:reduce){.pcard-cover{transform:none!important}.wire.flow,.cd.cd-overdue{animation:none}}

/* ============================================================================
   PROJEKTBIBLIOTHEK — Darstellungen (nur Optik; Fortschritt, Fristen, Aktionen bleiben)
   ============================================================================ */
.view.style-anim > .page{animation:surfIn .5s var(--ease)}
@keyframes surfIn{from{opacity:.35;transform:scale(.996)}to{opacity:1;transform:none}}
.lib-deco{display:none;pointer-events:none}
.view[class*="lib-"]:not(.lib-studio){color:var(--text);background-color:var(--bg)}
.view[class*="lib-"]:not(.lib-studio) .pcard-cover{outline:none}

/* DVD-Regal: Kunststoffhülle mit Rillenrücken, Glanz, Holzbrett */
.lib-dvd{--bg:#15110e;--bg-2:#1b1612;--panel:#231d18;--panel-2:#2b241e;--hover:#352c25;--active:#3c322a;--text:#f0e6d6;--text-2:#bcae99;--muted:#8a7d6b;--line:#3a3028;--line-2:#4d4136;--accent:var(--acc-d);--on-accent:#16130e;
  background:radial-gradient(ellipse at 50% -10%,rgba(255,200,140,.10),transparent 60%),linear-gradient(180deg,#1b1612,#100d0b) fixed}
.lib-dvd .hub-grid{gap:44px 26px}
.lib-dvd .pcard-cover{border-radius:6px;padding:5px 5px 5px 14px;background:linear-gradient(90deg,#08080a 0,#1d1d22 3px,#141418 12px,#26262c 13px,#1a1a1f 14px);box-shadow:0 18px 28px -10px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.07)}
.lib-dvd .pcard-cover .cover{border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.lib-dvd .lib-deco{display:block;position:absolute;z-index:5}
.lib-dvd .lib-a{left:2px;top:6px;bottom:6px;width:9px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.09) 0 1px,transparent 1px 4px);border-radius:2px}
.lib-dvd .lib-b{inset:0;border-radius:6px;background:linear-gradient(118deg,rgba(255,255,255,.17) 0,rgba(255,255,255,.04) 26%,transparent 27%,transparent 72%,rgba(255,255,255,.05) 100%)}
.lib-dvd .pcard-meta{position:relative;padding-top:16px}
.lib-dvd .pcard-meta::before{content:"";position:absolute;left:-15px;right:-15px;top:0;height:11px;border-radius:2px;background:linear-gradient(180deg,#8a6240,#5d3f27 60%,#3e2a1a);box-shadow:0 10px 16px -6px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,220,180,.25)}
.lib-dvd .pcard-cover{margin-bottom:-2px}
.lib-dvd .pcard-new{aspect-ratio:auto;height:calc(var(--card-w,240px) * 1.42);border-radius:6px}

/* Poster-Wand: Beton, schief geklebte Plakate mit Klebeband */
.lib-posters{--bg:#bdb8ae;--bg-2:#b3ada2;--panel:#e9e5dc;--panel-2:#dfdad0;--hover:#d6d0c4;--active:#cec7b9;--text:#23201b;--text-2:#4b453c;--muted:#6f685c;--line:#a8a194;--line-2:#958d7f;--accent:var(--acc-l);--on-accent:#fff9ee;
  background-color:#bdb8ae;background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1.4px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.6px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(0,0,0,.12),transparent 55%);background-size:7px 7px,11px 11px,100% 100%,100% 100%;background-attachment:local}
.lib-posters .hub-grid{gap:46px 30px;padding-top:12px}
.lib-posters .pcard-cover{overflow:visible;border-radius:0;box-shadow:0 14px 22px -10px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.18)}
.lib-posters .pcard-cover .cover{border-radius:0}
.lib-posters .pcard:nth-child(4n+1) .pcard-cover{--rz:-1.6deg}
.lib-posters .pcard:nth-child(4n+2) .pcard-cover{--rz:1.2deg}
.lib-posters .pcard:nth-child(4n+3) .pcard-cover{--rz:-.6deg}
.lib-posters .pcard:nth-child(4n) .pcard-cover{--rz:1.9deg}
.lib-posters .lib-deco{display:block;position:absolute;z-index:8;top:-11px;width:38%;height:22px;background:linear-gradient(180deg,rgba(246,240,220,.78),rgba(226,218,192,.72));box-shadow:0 1px 2px rgba(0,0,0,.18);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 12%,100% 24%,96% 38%,100% 52%,96% 66%,100% 80%,96% 92%,100% 100%,0 100%,4% 86%,0 72%,4% 58%,0 44%,4% 30%,0 18%)}
.lib-posters .lib-a{left:-7%;transform:rotate(-9deg)}
.lib-posters .lib-b{right:-7%;transform:rotate(8deg)}
.lib-posters .pcard-cover::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 35%,transparent 80%,rgba(0,0,0,.10))}
.lib-posters .pcard-meta{background:#f6f2e8;padding:7px 10px;box-shadow:0 3px 8px rgba(0,0,0,.18);transform:rotate(-.6deg);margin-top:4px}
.lib-posters .pcard-actions{top:30px}

/* Lederbücher: geprägter Ledereinband, Goldrahmen, Bild als eingeklebte Tafel */
.lib-books{--bg:#1e140e;--bg-2:#24180f;--panel:#2c1f15;--panel-2:#35261a;--hover:#402e20;--active:#4a3626;--text:#f3e5c8;--text-2:#cdb894;--muted:#9b8564;--line:#4a3726;--line-2:#5e4731;--accent:#d9b25e;--on-accent:#24170c;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 86px),linear-gradient(180deg,#2a1b11,#170f09);background-attachment:local}
.lib-books .hub-grid{gap:40px 28px}
.lib-books .pcard-cover{border-radius:3px 9px 9px 3px;padding:11% 9% 12% 15%;background:radial-gradient(ellipse at 30% 25%,rgba(255,255,255,.10),transparent 55%),radial-gradient(circle at 70% 80%,rgba(0,0,0,.25),transparent 50%),radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.5px) 0 0/5px 5px,linear-gradient(135deg,#6b3420,#4b2213 60%,#3a190d);box-shadow:0 18px 30px -12px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,210,150,.08),inset -6px 0 10px rgba(0,0,0,.35)}
.lib-books .lib-deco{display:block;position:absolute}
.lib-books .lib-a{left:0;top:0;bottom:0;width:10%;z-index:5;border-radius:3px 0 0 3px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.08) 70%,rgba(0,0,0,.35)),repeating-linear-gradient(180deg,transparent 0 22%,rgba(0,0,0,.35) 22% 23%,rgba(255,220,160,.18) 23% 24%,transparent 24% 26%)}
.lib-books .lib-b{left:calc(10% + 6px);right:6px;top:6px;bottom:6px;z-index:5;border:1.5px solid rgba(217,178,94,.75);outline:1px solid rgba(217,178,94,.35);outline-offset:3px;border-radius:2px 6px 6px 2px}
.lib-books .pcard-cover .cover{border-radius:2px;box-shadow:0 0 0 2px #c9a24f,0 0 0 4px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.5)}
.lib-books .pcard-name{font-family:var(--serif);font-size:16px;color:#e8c77e;letter-spacing:.3px}
.lib-books .pcard-progress{left:15%;right:9%;bottom:5%}

/* Galerie: helle Wand, Spot von oben, Rahmen mit Passepartout, Museumsschild */
.lib-gallery{--bg:#ecebe6;--bg-2:#e4e2db;--panel:#fafaf7;--panel-2:#f2f1ec;--hover:#e7e5de;--active:#dddad1;--text:#22201c;--text-2:#55514a;--muted:#86817a;--line:#d6d3cb;--line-2:#c4c0b6;--accent:var(--acc-l);--on-accent:#fff9ee;
  background:linear-gradient(180deg,#f3f2ee,#e6e4dd 85%,#d9d6cd);background-attachment:local}
.lib-gallery .hub-grid{gap:56px 40px;padding-top:10px}
.lib-gallery .pcard{position:relative}
.lib-gallery .pcard::before{content:"";position:absolute;left:-30%;right:-30%;top:-60px;height:115%;z-index:0;pointer-events:none;background:radial-gradient(ellipse 50% 60% at 50% 0,rgba(255,236,196,.75),rgba(255,236,196,.18) 55%,transparent 75%)}
.lib-gallery .pcard > *{position:relative;z-index:1}
.lib-gallery .pcard-cover{border-radius:1px;padding:10%;background:#fbfaf6;border:9px solid #2b2724;box-shadow:0 22px 30px -14px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.08),inset 0 3px 8px rgba(0,0,0,.12)}
.lib-gallery .pcard-cover .cover{border-radius:0;box-shadow:0 0 0 1px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.1)}
.lib-gallery .pcard-meta{align-self:center;max-width:88%;background:#fff;padding:7px 12px 8px;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.12);text-align:center;margin-top:8px}
.lib-gallery .pcard-sub{justify-content:center}
.lib-gallery .pcard-progress{left:9px;right:9px;bottom:9px}
.lib-gallery .pcard-new,.lib-posters .pcard-new{background:rgba(255,255,255,.45)}

/* Vorschau-Kacheln im Design-Fenster */
.dp-presets.libs{grid-template-columns:repeat(3,1fr)}
.lib-prev{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:5px;height:58px;border-radius:6px;padding:8px 6px;overflow:hidden;border:1px solid var(--line)}
.lib-prev i{width:17px;height:25px;border-radius:2px;background:linear-gradient(160deg,#c49a4f,#5b3c1e)}
.lib-prev i:nth-child(2){background:linear-gradient(160deg,#5aa0b8,#1d3a55)}
.lib-prev i:nth-child(3){background:linear-gradient(160deg,#c46a5a,#4a1d1d)}
.lp-studio{background:#19181c}
.lp-dvd{background:linear-gradient(180deg,#1b1612 70%,#6b4a2e 70% 82%,#120f0d 82%)}
.lp-dvd i{border-left:3px solid #111;box-shadow:0 0 0 1px #2a2a30}
.lp-posters{background:#bdb8ae;align-items:center}
.lp-posters i{border-radius:0;transform:rotate(-4deg);box-shadow:0 3px 4px rgba(0,0,0,.3)}
.lp-posters i:nth-child(2){transform:rotate(3deg)}
.lp-books{background:#24180f}
.lp-books i{background:linear-gradient(135deg,#7a3c24,#3a190d);box-shadow:inset 0 0 0 2px #24180f,inset 0 0 0 3px #c9a24f}
.lp-gallery{background:radial-gradient(ellipse at 50% 0,#fff3d6,#ecebe6 70%);align-items:center}
.lp-gallery i{border:3px solid #2b2724;box-shadow:inset 0 0 0 2px #fbfaf6}

/* ============================================================================
   PIPELINE & SHOTLIST — Oberflächen (pro Projekt; nur Farben und Material)
   ============================================================================ */
.view[class*="surf-"]:not(.surf-studio),.surf-prev{color:var(--text);background-color:var(--bg)}
.surf-paper{--bg:#f1ecdd;--bg-2:#ebe5d4;--panel:#fffdf6;--panel-2:#f8f4e8;--hover:#efe9da;--active:#e6dfcc;--text:#2b2620;--text-2:#5d5446;--muted:#8d8371;--line:#ddd3bd;--line-2:#cbbfa5;--accent:var(--acc-l);--on-accent:#fff9ee;--shadow:0 14px 34px rgba(80,60,30,.14);--shadow-sm:0 1px 3px rgba(80,60,30,.1);
  background-image:linear-gradient(90deg,transparent 54px,rgba(200,80,70,.28) 54px 56px,transparent 56px),repeating-linear-gradient(180deg,transparent 0 27px,rgba(70,110,170,.13) 27px 28px);background-attachment:local}
.surf-blueprint{--bg:#103a6a;--bg-2:#134272;--panel:rgba(22,72,124,.86);--panel-2:#1b5089;--hover:#21599a;--active:#2563a8;--text:#eaf2ff;--text-2:#b9cff0;--muted:#86a6cf;--line:rgba(200,225,255,.20);--line-2:rgba(200,225,255,.34);--accent:#f4c95d;--on-accent:#10233c;--shadow:0 16px 36px rgba(0,10,30,.45);
  background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-attachment:local}
.surf-blueprint .page-title{font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}
.surf-kraft{--bg:#c9a97c;--bg-2:#c1a073;--panel:#fbf7ec;--panel-2:#f3ecdc;--hover:#ece3cf;--active:#e3d8bf;--text:#2a2118;--text-2:#5b4a36;--muted:#86725a;--line:#dccbaa;--line-2:#c8b28a;--accent:#9e3b2c;--on-accent:#fff5ea;--shadow:0 12px 26px rgba(70,45,15,.28);--shadow-sm:0 1px 3px rgba(70,45,15,.18);
  background-image:radial-gradient(rgba(90,60,25,.16) 1px,transparent 1.4px),radial-gradient(rgba(255,240,210,.25) 1px,transparent 1.6px);background-size:6px 6px,9px 9px;background-attachment:local}
.surf-kraft .panel,.surf-kraft .phase,.surf-kraft table{box-shadow:var(--shadow-sm)}
.surf-kraft .page-title{font-family:'Special Elite','Courier Prime',var(--mono);letter-spacing:.5px}
.surf-film{--bg:#0b0a0c;--bg-2:#121014;--panel:#17151a;--panel-2:#1e1b21;--hover:#262229;--active:#2d2830;--text:#f2ead8;--text-2:#b9ae98;--muted:#7f7666;--line:#2a262d;--line-2:#3a3540;--accent:#e9b34c;--on-accent:#1a1308;
  background-image:repeating-linear-gradient(180deg,transparent 0 10px,rgba(255,255,255,.10) 10px 20px,transparent 20px 28px),repeating-linear-gradient(180deg,transparent 0 10px,rgba(255,255,255,.10) 10px 20px,transparent 20px 28px),radial-gradient(ellipse at 50% 0,rgba(233,179,76,.10),transparent 60%);background-size:9px 28px,9px 28px,100% 100%;background-position:6px 0,calc(100% - 6px) 0,0 0;background-repeat:repeat-y,repeat-y,no-repeat;background-attachment:local}
.surf-film .page-title{text-transform:uppercase;letter-spacing:2px}
.surf-film .page{padding-left:max(28px,4vw);padding-right:max(28px,4vw)}
.surf-prev{position:relative;display:flex;flex-direction:column;justify-content:center;gap:5px;height:58px;border-radius:6px;padding:9px 12px;overflow:hidden;border:1px solid var(--line-2)}
.surf-prev b{display:block;height:10px;width:60%;border-radius:2px;background:var(--accent)}
.surf-prev i{display:block;height:9px;border-radius:2px;background:var(--panel);border:1px solid var(--line)}
.surf-prev.surf-film{background-size:5px 14px,5px 14px,100% 100%;background-position:2px 0,calc(100% - 2px) 0,0 0}

/* ============================================================================
   TOUCH (Tablet & Smartphone): größere Ziele, nichts nur per Hover erreichbar
   ============================================================================ */
html.touch .btn{height:40px;padding:0 14px;font-size:13px}
html.touch .icon-btn{min-width:40px;min-height:40px}
html.touch .tabs button,html.touch .seg button{min-height:38px}
html.touch .inp,html.touch select.sel,html.touch textarea{min-height:40px;font-size:16px}
html.touch .menu-item{min-height:44px}
html.touch .bt-pill{min-height:40px;min-width:40px}
html.touch input[type=range]{height:30px}
html.touch .mini-range{min-height:40px}
html.touch .pcard-actions{opacity:1;transform:none;gap:8px}
html.touch .pcard-actions button{width:38px;height:38px}
html.touch .dp-chip,html.touch .dp-preset{min-height:44px}
html.touch .port{width:24px;height:24px;margin-top:-12px}
html.touch .port-out{right:-13px}
html.touch .wire-end{width:26px;height:26px;margin:-13px 0 0 -13px;opacity:.85}
html.touch .wire-hit{stroke-width:30}
html.touch .node-resize{width:30px;height:30px;opacity:.75}
html.touch .node-grip{height:32px;font-size:10.5px}
html.touch .node.selected .node-del,html.touch .node-text .node-grip{display:flex;opacity:1}
html.touch .sh-grip{width:40px;opacity:.8}
html.touch .cd,html.touch .chip{min-height:28px}
html.touch .design-pop{max-height:70vh;overflow:auto}
html.touch ::-webkit-scrollbar{width:4px;height:4px}
@media (max-width:640px){
  html.touch .head-actions .btn span.hide-sm{display:none}
  .lib-dvd .pcard-meta::before{left:-8px;right:-8px}
  .lib-gallery .hub-grid,.lib-posters .hub-grid,.lib-books .hub-grid,.lib-dvd .hub-grid{gap:34px 16px}
  .lib-gallery .pcard-cover{border-width:6px}
  .surf-paper{background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(70,110,170,.13) 27px 28px)}
}
/* Touch: statt fünf Knöpfen ein „Mehr“-Knopf auf dem Cover (öffnet das Menü) */
.pcard-more{display:none}
html.touch .pcard-actions{display:none}
html.touch .pcard-more{display:flex;position:absolute;top:8px;right:8px;z-index:8;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(14,14,16,.72);color:#f3eee4;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
html.touch .lib-posters .pcard-more{top:18px}
html.touch .lib-books .pcard-more{top:14%;right:12%}
html.touch .lib-gallery .pcard-more{top:12%;right:12%}
html.touch .dept button{min-width:40px;min-height:34px}
html.touch .menu{min-width:220px}

</style>

  "tour.design.d":["Über die Palette gibst du jedem Denkbrett sein eigenes Aussehen – z. B. <b>Pinnwand</b> mit Kork und Notizzetteln oder <b>Blaupause</b>; Hintergrund und Knoten lassen sich auch einzeln wählen. Daneben: Vollbild nur für die Arbeitsfläche (<kbd>F11</kbd>, beenden mit <kbd>Esc</kbd>).", "Use the palette to give each board its own look – e.g. a <b>pinboard</b> with cork and sticky notes or a <b>blueprint</b>; background and nodes can also be chosen separately. Next to it: fullscreen for just the canvas (<kbd>F11</kbd>, exit with <kbd>Esc</kbd>).", "La palette donne à chaque tableau son style – <b>liège</b> et post-it, <b>plan</b>… Fond et nœuds se règlent aussi séparément. À côté : plein écran (<kbd>F11</kbd>, <kbd>Échap</kbd> pour sortir).", "La paleta da a cada tablero su aspecto: <b>corcho</b> y notas, <b>plano</b>… Fondo y nodos también por separado. Al lado: pantalla completa (<kbd>F11</kbd>, salir con <kbd>Esc</kbd>).", "La tavolozza dà a ogni lavagna il suo stile: <b>sughero</b> e foglietti, <b>cianografia</b>… Sfondo e nodi anche separati. Accanto: schermo intero (<kbd>F11</kbd>, esci con <kbd>Esc</kbd>).", "A paleta dá a cada quadro seu visual: <b>cortiça</b> e post-its, <b>planta</b>… Fundo e nós também separados. Ao lado: tela cheia (<kbd>F11</kbd>, sair com <kbd>Esc</kbd>)."],

  "tour.versions.t":["Versionen", "Versions", "Versions", "Versiones", "Versioni", "Versões"],
  "tour.versions.d":["Hier liegen alle Sicherungspunkte – automatisch, bei jedem Speichern und benannt (<kbd>Strg</kbd>+<kbd>Alt</kbd>+<kbd>S</kbd>). Jede Version lässt sich wiederherstellen, als Kopie öffnen oder exportieren.", "All restore points live here – automatic, on every save, and named ones (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>S</kbd>). Restore any version, open it as a copy or export it.", "Tous les points de restauration : automatiques, à l’enregistrement et nommés (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>S</kbd>).", "Todos los puntos de restauración: automáticos, al guardar y con nombre (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>S</kbd>).", "Tutti i punti di ripristino: automatici, a ogni salvataggio e con nome (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>S</kbd>).", "Todos os pontos de restauração: automáticos, ao salvar e nomeados (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>S</kbd>)."],

  "tour.shots.d":["Jeder Shot mit Frames, Laufzeit, Linse und Department-Status. Am <b>Griff rechts</b> ziehst du Shots in eine neue Reihenfolge.", "Each shot with frames, runtime, lens and department status. Drag the <b>handle on the right</b> to reorder shots.", "Chaque plan avec images, durée, objectif et statut. Glissez la <b>poignée à droite</b> pour réordonner.", "Cada plano con frames, duración, lente y estado. Arrastra el <b>asa derecha</b> para reordenar.", "Ogni inquadratura con frame, durata, lente e stato. Trascina la <b>maniglia a destra</b> per riordinare.", "Cada plano com frames, duração, lente e status. Arraste a <b>alça à direita</b> para reordenar."],

  "tour.welcome.t":["Willkommen in VertexForge Studio", "Welcome to VertexForge Studio", "Bienvenue dans VertexForge Studio", "Bienvenido a VertexForge Studio", "Benvenuto in VertexForge Studio", "Bem-vindo ao VertexForge Studio"],
  "tour.welcome.d":["Dein Planungs-Cockpit für 3D-Projekte – von der Idee über Blender, ZBrush, Substance & Co. bis zum Render. In einer Minute zeigen wir dir das Wichtigste. Du kannst jederzeit mit <kbd>Esc</kbd> abbrechen.", "Your planning cockpit for 3D projects – from idea through Blender, ZBrush, Substance & co. to the final render. This one-minute tour shows the essentials. Press <kbd>Esc</kbd> any time to leave.", "Ton cockpit de planification pour projets 3D – de l’idée au rendu, en passant par Blender, ZBrush, Substance… Une minute pour l’essentiel. <kbd>Échap</kbd> pour quitter.", "Tu cabina de planificación para proyectos 3D – de la idea al render, pasando por Blender, ZBrush, Substance… Un minuto para lo esencial. <kbd>Esc</kbd> para salir.", "Il tuo cockpit di pianificazione per progetti 3D – dall’idea al render, passando per Blender, ZBrush, Substance… Un minuto per l’essenziale. <kbd>Esc</kbd> per uscire.", "Seu cockpit de planejamento para projetos 3D – da ideia ao render, passando por Blender, ZBrush, Substance… Um minuto para o essencial. <kbd>Esc</kbd> para sair."],
  "tour.hub.t":["Projekte mit Cover", "Projects with covers", "Projets avec couverture", "Proyectos con portada", "Progetti con copertina", "Projetos com capa"],
  "tour.hub.d":["Jedes Projekt hat ein 2:3-Cover. <b>Klick</b> öffnet es. Beim Überfahren erscheinen Schnellaktionen (Titel-Designer, Bild, Duplizieren …), <b>Rechtsklick</b> zeigt alle.", "Every project has a 2:3 cover. <b>Click</b> opens it. Hover for quick actions (title designer, image, duplicate …), <b>right-click</b> for all of them.", "Chaque projet a une couverture 2:3. <b>Clic</b> pour ouvrir, survol pour les actions rapides, <b>clic droit</b> pour tout.", "Cada proyecto tiene portada 2:3. <b>Clic</b> para abrir, pasa el ratón para acciones rápidas, <b>clic derecho</b> para todas.", "Ogni progetto ha una copertina 2:3. <b>Clic</b> per aprire, passa sopra per le azioni rapide, <b>clic destro</b> per tutte.", "Cada projeto tem uma capa 2:3. <b>Clique</b> para abrir, passe o mouse para ações rápidas, <b>botão direito</b> para todas."],
  "tour.new.t":["Neues Projekt", "New project", "Nouveau projet", "Nuevo proyecto", "Nuovo progetto", "Novo projeto"],
  "tour.new.d":["Starte leer oder mit einer Vorlage (Character, Environment, Hard-Surface, Motion, Kurzfilm) – Phasen, Aufgaben und Programme sind dann schon angelegt. <kbd>Strg</kbd>+<kbd>N</kbd>", "Start blank or from a template (character, environment, hard-surface, motion, short film) – phases, tasks and programs are set up for you. <kbd>Ctrl</kbd>+<kbd>N</kbd>", "Partez de zéro ou d’un modèle (personnage, environnement, hard-surface, motion, court-métrage) – phases, tâches et logiciels sont prêts. <kbd>Ctrl</kbd>+<kbd>N</kbd>", "Empieza en blanco o con una plantilla (personaje, entorno, hard-surface, motion, cortometraje): fases, tareas y programas ya listos. <kbd>Ctrl</kbd>+<kbd>N</kbd>", "Parti da zero o da un modello (personaggio, ambiente, hard-surface, motion, corto): fasi, attività e programmi già pronti. <kbd>Ctrl</kbd>+<kbd>N</kbd>", "Comece do zero ou de um modelo (personagem, ambiente, hard-surface, motion, curta): fases, tarefas e programas já prontos. <kbd>Ctrl</kbd>+<kbd>N</kbd>"],
  "tour.size.t":["Cover-Größe", "Cover size", "Taille des couvertures", "Tamaño de portadas", "Dimensione copertine", "Tamanho das capas"],
  "tour.size.d":["Mit diesem Regler stellst du ein, wie groß die Cover im Hub erscheinen – daneben regelst du die Titelgröße.", "This slider sets how large the covers appear in the hub – the one next to it scales the titles.", "Ce curseur règle la taille des couvertures ; le suivant, celle des titres.", "Este control ajusta el tamaño de las portadas; el de al lado, los títulos.", "Questo cursore regola le copertine; quello accanto i titoli.", "Este controle ajusta o tamanho das capas; o ao lado, os títulos."],
  "tour.tabs.t":["Arbeitsbereiche", "Workspaces", "Espaces de travail", "Espacios de trabajo", "Aree di lavoro", "Áreas de trabalho"],
  "tour.tabs.d":["Projekte, Pipeline, Denkbrett, Shotlist, Story und Anleitung. Wechseln mit <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>6</kbd> oder <kbd>Strg</kbd>+<kbd>Bild↑/↓</kbd>.", "Projects, pipeline, board, shot list, story and guide. Switch with <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>6</kbd> or <kbd>Ctrl</kbd>+<kbd>PgUp/PgDn</kbd>.", "Projets, pipeline, tableau, plans, histoire et guide. <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>6</kbd> pour changer.", "Proyectos, pipeline, tablero, planos, historia y guía. Cambia con <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>6</kbd>.", "Progetti, pipeline, lavagna, inquadrature, storia e guida. Cambia con <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>6</kbd>.", "Projetos, pipeline, quadro, planos, história e guia. Troque com <kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>6</kbd>."],

  "tour.kpi.d":["Fortschritt, nächste Deadline mit Live-Countdown und kritische Aufgaben – farbcodiert von OK bis überfällig.", "Progress, the next deadline with a live countdown and critical tasks – color-coded from OK to overdue.", "Avancement, prochaine échéance avec compte à rebours et tâches critiques – codés par couleur.", "Progreso, próxima fecha límite con cuenta atrás y tareas críticas, con código de colores.", "Avanzamento, prossima scadenza con conto alla rovescia e attività critiche, codificati a colori.", "Progresso, próximo prazo com contagem regressiva e tarefas críticas, com cores."],

  "tour.timeline.d":["Die Phasen deines Projekts als Balken – so siehst du sofort, wo es eng wird.", "Your project phases as bars – spot tight spots instantly.", "Les phases du projet en barres – repérez vite les goulots.", "Las fases como barras: ves al instante dónde se aprieta.", "Le fasi come barre: vedi subito dove stringe.", "As fases como barras: veja na hora onde aperta."],

  "tour.phases.d":["Jede Phase hat Start, Deadline und Programm-Badges. Aufgaben bekommen Priorität (Low → Critical), Datum und Häkchen. Oben schaltest du zwischen Liste und Kanban um.", "Each phase has a start, deadline and program badges. Tasks get a priority (Low → Critical), a date and a checkbox. Switch between list and kanban at the top.", "Chaque phase a un début, une échéance et des badges logiciels. Les tâches ont priorité, date et case à cocher. Liste ou kanban en haut.", "Cada fase tiene inicio, fecha límite e insignias de programas. Las tareas tienen prioridad, fecha y casilla. Lista o kanban arriba.", "Ogni fase ha inizio, scadenza e badge dei programmi. Le attività hanno priorità, data e spunta. Lista o kanban in alto.", "Cada fase tem início, prazo e selos de programas. As tarefas têm prioridade, data e caixa. Lista ou kanban no topo."],

  "tour.tpl.d":["Füge fertige Pipeline-Abschnitte (z. B. Retopo → UV → Texturing) in ein bestehendes Projekt ein.", "Drop ready-made pipeline sections (e.g. retopo → UV → texturing) into an existing project.", "Ajoutez des sections de pipeline prêtes (ex. retopo → UV → texturing).", "Añade secciones de pipeline listas (p. ej. retopo → UV → texturizado).", "Aggiungi sezioni di pipeline pronte (es. retopo → UV → texturing).", "Adicione seções de pipeline prontas (ex.: retopo → UV → texturização)."],
  "tour.toolbar.t":["Das Denkbrett", "The board", "Le tableau", "El tablero", "La lavagna", "O quadro"],
  "tour.toolbar.d":["Unendliche Fläche für Referenzen, Asset-Karten, Notizen, Mindmaps und Titel. Links die Werkzeuge (Auswählen/Verschieben und Hinzufügen), oben wechselst du das Denkbrett. Hinzufügen auch mit <kbd>Shift</kbd>+<kbd>A</kbd>.", "An infinite canvas for references, asset cards, notes, mind maps and titles. Tools on the left (select/pan and add), switch boards at the top. Add things with <kbd>Shift</kbd>+<kbd>A</kbd>.", "Toile infinie. Outils à gauche, choix du tableau en haut. Ajouter : <kbd>Maj</kbd>+<kbd>A</kbd>.", "Lienzo infinito. Herramientas a la izquierda, tableros arriba. Añadir: <kbd>Mayús</kbd>+<kbd>A</kbd>.", "Tela infinita. Strumenti a sinistra, lavagne in alto. Aggiungi: <kbd>Maiusc</kbd>+<kbd>A</kbd>.", "Tela infinita. Ferramentas à esquerda, quadros no topo. Adicionar: <kbd>Shift</kbd>+<kbd>A</kbd>."],

  "tour.canvas.d":["<b>Mausrad</b> zoomt, <b>Mitte/Rechts ziehen</b> verschiebt, <kbd>G</kbd>/<kbd>S</kbd> bewegt/skaliert. Vom <b>●-Port</b> rechts an einer Karte ziehst du beliebig viele Verbindungen. Bilder & Titel nahe an eine Asset-Karte ziehen dockt sie an – <b>wieder wegziehen</b> löst sie. <b>Rechtsklick</b> bricht ab.", "<b>Wheel</b> zooms, <b>middle/right drag</b> pans, <kbd>G</kbd>/<kbd>S</kbd> move/scale. Drag from the <b>● port</b> on a card’s right edge for as many connections as you like. Drop images & titles near an asset card to dock them – <b>drag them away</b> to detach. <b>Right-click</b> cancels.", "<b>Molette</b> = zoom, <b>clic milieu/droit</b> = déplacer. Tirez depuis le <b>port ●</b> pour relier. Approchez images et titres d’une carte pour les ancrer – <b>éloignez-les</b> pour les détacher.", "<b>Rueda</b> = zoom, <b>arrastrar medio/derecho</b> = mover. Arrastra desde el <b>puerto ●</b> para conectar. Acerca imágenes a una tarjeta para acoplarlas; <b>apártalas</b> para soltarlas.", "<b>Rotella</b> = zoom, <b>trascina centrale/destro</b> = sposta. Trascina dalla <b>porta ●</b> per collegare. Avvicina immagini a una scheda per agganciarle; <b>allontanale</b> per staccarle.", "<b>Roda</b> = zoom, <b>arrastar meio/direito</b> = mover. Arraste do <b>porto ●</b> para conectar. Aproxime imagens de um cartão para acoplar; <b>afaste</b> para soltar."],

function t(key, vars){
  const row = T[key];
  let s;
  if(row){ const i = LANG_ORDER.indexOf(currentLang()); s = row[i]; if(s==null || s==='') s = row[1] || row[0]; }
  else s = key;
  if(vars) s = s.replace(/\{(\w+)\}/g, (m,k)=> vars[k]!=null ? vars[k] : m);
  return s;
}
function plural(n){ return Math.abs(n)===1 ? t('g.day') : t('g.days'); }
