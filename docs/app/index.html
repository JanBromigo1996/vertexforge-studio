<style>
/* ============================================================================
   1. DESIGN-TOKENS
   Studio dunkel (warmes Graphit) · Papyrus hell (gedämpftes Pergament, augenschonend)
   ============================================================================ */
:root{
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --serif:'Cormorant Garamond','EB Garamond',Georgia,serif;
  --r-xs:3px; --r-sm:5px; --r:7px; --r-lg:11px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ok:#5f9e6e; --warn:#c48f2c; --danger:#c25247; --crit:#ab3a5a; --info:#5a8bbf; --review:#8d72c4;
  --topbar-h:44px; --statusbar-h:26px;
}
html[data-mode="dark"]{
  --bg:#141316; --bg-2:#19181c; --panel:#1f1e23; --panel-2:#26252b; --hover:#2e2d34; --active:#34333b;
  --paper:#1e1c19; --paper-text:#e6dfd2; --canvas:#161519; --dot:#2c2b31;
  --text:#ece6da; --text-2:#aaa397; --muted:#77716a; --line:#2b2a30; --line-2:#3d3b43;
  --shadow:0 20px 44px rgba(0,0,0,.52); --shadow-sm:0 2px 10px rgba(0,0,0,.32); --inset:inset 0 1px 0 rgba(255,255,255,.03);
  --accent:var(--acc-d); --on-accent:#16130e; --note:#3a3426;
  color-scheme:dark;
}
/* Papyrus hell: warmes Papier statt Weiß, klare Ebenen (Fläche → Panel → Feld), dunkle Tinte */
html[data-mode="light"]{
  --bg:#ebe5d9; --bg-2:#e4ddcf; --panel:#f7f3eb; --panel-2:#f1ebe0; --hover:#e6dfd1; --active:#ddd4c3;
  --paper:#fbf8f1; --paper-text:#2d2720; --canvas:#e9e3d6; --dot:#cbc1ad;
  --text:#2a251e; --text-2:#5a5145; --muted:#8a7f6f; --line:#dad1c0; --line-2:#c6baa4;
  --shadow:0 18px 44px rgba(64,48,26,.16),0 2px 6px rgba(64,48,26,.06); --shadow-sm:0 1px 2px rgba(64,48,26,.08),0 2px 8px rgba(64,48,26,.06); --inset:inset 0 1px 0 rgba(255,255,255,.65);
  --accent:var(--acc-l); --on-accent:#fff9ee; --note:#f2e3ab;
  color-scheme:light;
}
html[data-theme="fantasy"]  {--acc-d:#cfa75c; --acc-l:#86591c; --display:'Cinzel',serif}
html[data-theme="scifi"]    {--acc-d:#5cc4d3; --acc-l:#1d6b77; --display:'Orbitron',sans-serif}
html[data-theme="classic"]  {--acc-d:#cc7461; --acc-l:#8f3324; --display:'Playfair Display',serif}
html[data-theme="mythology"]{--acc-d:#7fb6a5; --acc-l:#2c6556; --display:'Cinzel Decorative',serif}
:root{
  --acc-soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --acc-line:color-mix(in srgb,var(--accent) 45%,transparent);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--accent)}
::-webkit-scrollbar-corner{background:transparent}
.ic{display:inline-block;vertical-align:-3px;flex-shrink:0}
[hidden]{display:none!important}
kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:var(--panel-2);color:var(--text);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ============================================================================
   2. STEUERELEMENTE
   ============================================================================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,filter .15s;box-shadow:var(--inset)}
.btn:hover{background:var(--hover);border-color:var(--line-2)}
.btn:active{transform:translateY(.5px) scale(.985)}
.btn,.icon-btn,.tabs button,.menu-item,.seg button{transition-duration:.12s}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.08)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger);filter:brightness(1.1)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2);box-shadow:none}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-xs{height:24px;padding:0 8px;font-size:11px}
.btn.on{border-color:var(--acc-line);color:var(--accent);background:var(--acc-soft)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;transition:all .15s;flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--text);border-color:var(--line)}
.icon-btn.sm{width:24px;height:24px}
.icon-btn.danger:hover{color:var(--danger)}
.icon-btn.on{color:var(--accent);background:var(--acc-soft);border-color:var(--acc-line)}
.inp,select.sel{height:30px;padding:0 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:12px;outline:none;transition:border-color .15s,background .15s;min-width:0}
textarea.inp{height:auto;padding:7px 9px;resize:vertical;line-height:1.5}
.inp:focus,select.sel:focus{border-color:var(--accent);background:var(--panel)}
.inp::placeholder,textarea::placeholder{color:var(--muted)}
input[type=range]{accent-color:var(--accent);cursor:pointer;min-width:0}
input[type=date]{cursor:pointer}
input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);cursor:pointer;flex-shrink:0}
input[type=number]{-moz-appearance:textfield}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}
.inline{display:flex;gap:6px;align-items:center;min-width:0}
.grow{flex:1;min-width:0}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-2);flex-wrap:wrap}
.seg button{height:26px;padding:0 10px;border:none;border-radius:3px;background:transparent;color:var(--text-2);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--panel-2);color:var(--accent);box-shadow:var(--shadow-sm)}
.chk{position:relative;width:18px;height:18px;display:inline-block;cursor:pointer;flex-shrink:0}
.chk input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chk span{position:absolute;inset:0;border:1.5px solid var(--muted);border-radius:4px;background:var(--panel);transition:all .15s}
.chk input:checked+span{background:var(--accent);border-color:var(--accent)}
.chk input:checked+span::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.switch{position:relative;width:34px;height:19px;flex-shrink:0;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .2s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--panel-2);box-shadow:var(--shadow-sm);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(15px)}

/* ============================================================================
   3. KOPFLEISTE, MENÜS, STATUSLEISTE
   ============================================================================ */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;height:var(--topbar-h);padding:0 0 0 8px;background:var(--bg-2);border-bottom:1px solid var(--line);z-index:60;user-select:none;position:relative}
.tb-left{display:flex;align-items:center;gap:4px;min-width:0}
.brand{display:grid;place-items:center;width:34px;height:30px;border:none;border-radius:var(--r-sm);background:transparent;cursor:pointer;flex-shrink:0;transition:background .12s}
.brand:hover{background:var(--hover)}
.menubar{display:flex;gap:0;flex-shrink:0}
.menubar button{height:28px;padding:0 9px;border:none;border-radius:var(--r-sm);background:transparent;color:var(--text-2);font-size:12.5px;cursor:pointer;transition:background .1s,color .1s}
.menubar button:hover,.menubar button.open{background:var(--hover);color:var(--text)}
.proj-crumb{display:flex;align-items:center;gap:7px;height:28px;min-width:0;max-width:220px;margin-left:6px;padding:0 9px 0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--inset);transition:border-color .12s,background .12s}
.proj-crumb:hover,.proj-crumb.open{border-color:var(--line-2);background:var(--panel-2)}
.proj-crumb .pc-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--acc-soft);flex-shrink:0}
.proj-crumb .pc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.2px}
.proj-crumb .ic{color:var(--muted)}
.tabs{position:relative;justify-self:center;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab-ink{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:6px;background:var(--panel-2);border:1px solid var(--acc-line);box-shadow:var(--shadow-sm);transition:transform .26s var(--ease),width .26s var(--ease);pointer-events:none}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:6px;border:none;background:transparent;color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
.tabs button:hover{color:var(--text)}
.tabs button:not(.active):hover{background:color-mix(in srgb,var(--hover) 60%,transparent)}
.tabs button.active{color:var(--accent)}
.tb-right{display:flex;align-items:center;justify-content:flex-end;align-self:stretch;min-width:0}
.tb-tools{display:flex;align-items:center;gap:2px;padding-right:8px}
.tb-view{display:flex;align-items:center;gap:2px}
.tb-sep{width:1px;height:18px;background:var(--line);margin:0 5px}
.save-btn{position:relative}
.save-btn .sv-dot{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:transparent;transition:background .2s,transform .2s;transform:scale(.4)}
.save-btn.linked .sv-dot{background:var(--ok);transform:scale(.8)}
.save-btn.dirty .sv-dot{background:var(--warn);transform:scale(1);box-shadow:0 0 0 2px var(--bg-2)}
.save-btn.error{color:var(--danger)}
.save-btn.error .sv-dot{background:var(--danger);transform:scale(1)}
.save-btn.flash{animation:saveFlash .5s var(--ease)}
@keyframes saveFlash{30%{color:var(--accent);transform:scale(1.12)}}
/* Fenstersteuerung (Desktop-App) – wie Windows 11, ins Design integriert */
.win-ctl{display:flex;align-self:stretch;margin-left:2px}
.win-ctl button{width:46px;border:none;background:transparent;color:var(--text-2);display:grid;place-items:center;cursor:default;transition:background .1s,color .1s}
.win-ctl button:hover{background:var(--hover);color:var(--text)}
.win-ctl button:active{background:var(--active)}
.win-ctl button.close:hover{background:#c42b1c;color:#fff}
.win-ctl button.close:active{background:#b22a1b;color:#fff}
.win-edges .we{position:fixed;z-index:4000}
.we-t{top:0;left:8px;right:8px;height:4px;cursor:ns-resize}
.we-b{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.we-l{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.we-r{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.we-tl{left:0;top:0;width:8px;height:8px;cursor:nwse-resize}
.we-br{right:0;bottom:0;width:10px;height:10px;cursor:nwse-resize}
.we-tr{right:0;top:0;width:8px;height:8px;cursor:nesw-resize}
.we-bl{left:0;bottom:0;width:10px;height:10px;cursor:nesw-resize}
html.win-max .win-edges{display:none}
html.frameless .app{border:1px solid color-mix(in srgb,var(--line-2) 70%,transparent)}
html.frameless.win-max .app{border:none}
.sb-save{display:inline-flex;align-items:center;gap:6px}
.sb-save .d{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.sb-save.dirty .d{background:var(--warn)}
.sb-save.error{color:var(--danger)} .sb-save.error .d{background:var(--danger)}

.statusbar{height:var(--statusbar-h);display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--bg-2);border-top:1px solid var(--line);font-size:11px;color:var(--muted);z-index:40;padding-bottom:env(safe-area-inset-bottom);overflow:hidden;white-space:nowrap}
.statusbar .sb-hints{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;gap:12px;align-items:center}
.statusbar .sb-hints span{display:inline-flex;gap:4px;align-items:center}
.statusbar kbd{font-size:9.5px;padding:0 4px}
.statusbar .sb-right{display:flex;gap:12px;align-items:center}
.statusbar select{height:20px;border:none;background:transparent;color:var(--text-2);font-size:11px;cursor:pointer;outline:none}
.statusbar .sb-ver{font-family:var(--mono);font-size:10px}

.main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none}
.view.active{display:block}
.view.fill{overflow:hidden}
/* Bewegung: kurz, gleiche Kurve überall – fühlt sich zusammenhängend an, nie träge */
.view.active{z-index:1}
.view.leaving{display:block;pointer-events:none;z-index:0;animation:vOut .19s var(--ease) forwards}
.view.entering{animation:vIn .23s var(--ease)}
@keyframes vOut{to{opacity:0;transform:translateX(calc(var(--dir,1) * -40px))}}
@keyframes vIn{from{opacity:0;transform:translateX(calc(var(--dir,1) * 40px))}}
html.mode-swap,html.mode-swap *{transition:background-color .24s ease,border-color .24s ease,color .2s ease,fill .2s ease!important}

/* Kontextmenüs & Dropdowns */
.menu{position:fixed;z-index:950;min-width:210px;max-width:320px;padding:5px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);animation:menuIn .1s var(--ease);transform-origin:top left;user-select:none}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
.menu-title{padding:5px 9px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;height:29px;padding:0 9px;border:none;border-radius:4px;background:transparent;color:var(--text);font-size:12.5px;cursor:pointer;text-align:left}
.menu-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item kbd{background:transparent;border-color:var(--line);color:var(--muted);font-size:10px}
.menu-item .ic{color:var(--text-2)}
.menu-item:hover,.menu-item.hl{background:var(--acc-soft);color:var(--text)}
.menu-item:hover .ic{color:var(--accent)}
.menu-item.danger{color:var(--danger)} .menu-item.danger .ic{color:var(--danger)}
.menu-item[disabled]{opacity:.4;pointer-events:none}
.menu-item .check{width:14px;color:var(--accent)}
.menu-sep{height:1px;background:var(--line);margin:5px 4px}
.menu-swatches{display:flex;gap:5px;padding:5px 9px;flex-wrap:wrap}
.menu-swatches button{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer}
.menu-swatches button:hover{transform:scale(1.12)}

/* Befehlssuche (F3) */
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:960;overflow:hidden;animation:menuIn .15s var(--ease)}
.palette input{width:100%;height:48px;border:none;border-bottom:1px solid var(--line);background:transparent;padding:0 18px;font-size:15px;outline:none}
.palette-list{max-height:52vh;overflow:auto;padding:6px}
.palette-list .menu-item{height:34px}
.palette-list .grp{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-left:auto;padding-left:10px;letter-spacing:.8px;text-transform:uppercase}
.palette-empty{padding:18px;color:var(--muted);text-align:center}

/* Seitenrahmen */
.page{max-width:1500px;margin:0 auto;padding:26px 30px 70px}
.page.wide{max-width:1720px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.page-title{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:.6px;margin-top:3px;line-height:1.15}
.page-sub{color:var(--text-2);margin-top:5px;max-width:760px}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm),var(--inset)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

/* ============================================================================
   4. PROJEKTE & COVER
   ============================================================================ */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,min(var(--card-w,240px),100%));gap:28px 22px;justify-content:start}
.mini-range{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--text-2);font-size:11.5px}
.mini-range input[type=range]{width:90px}
.mini-range .sel{height:24px;border:none;background:transparent;padding:0 2px}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
.search .inp{padding-left:30px;width:200px}
.pcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard-cover{position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.38);outline:1px solid rgba(255,255,255,.06);transition:transform .28s var(--ease),box-shadow .28s,outline-color .2s}
.pcard-cover:hover{--ty:-4px;box-shadow:0 22px 44px rgba(0,0,0,.5)}
.pcard.active .pcard-cover{outline:2px solid var(--accent);outline-offset:3px}
.pcard-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:6}
.pcard-progress>div{height:100%;background:var(--accent)}
.pcard-active{position:absolute;left:8px;bottom:10px;z-index:6;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:rgba(10,10,12,.72);color:#e9cf93;border:1px solid rgba(233,207,147,.4);backdrop-filter:blur(4px)}
.pcard-actions{position:absolute;top:32px;right:8px;z-index:7;display:flex;flex-direction:column;gap:5px;opacity:0;transform:translateX(6px);transition:all .2s var(--ease)}
.pcard-cover:hover .pcard-actions,.pcard-cover:focus-within .pcard-actions{opacity:1;transform:none}
.pcard-actions button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.16);background:rgba(14,14,16,.8);color:#eee;cursor:pointer;backdrop-filter:blur(6px);transition:all .15s}
.pcard-actions button:hover{background:#d8b56c;color:#16130e;border-color:#d8b56c}
.pcard-actions button.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.pcard-meta{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.pcard-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-sub{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.pcard-new{aspect-ratio:2/3;border:1px dashed var(--line-2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-2);cursor:pointer;background:color-mix(in srgb,var(--panel) 70%,transparent);transition:all .2s;text-align:center;padding:16px}
.pcard-new:hover{border-color:var(--accent);color:var(--accent);background:var(--panel)}
.pcard-new .plus{width:48px;height:48px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center}

.cover{position:relative;aspect-ratio:2/3;width:100%;overflow:hidden;background:#0b0b0d;container-type:inline-size;user-select:none}
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.pcard-cover:hover .cover-img{transform:scale(1.035)}
.cover-vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,6,8,calc(var(--vig)*.55)) 0%,rgba(6,6,8,0) 32%,rgba(6,6,8,calc(var(--vig)*.25)) 60%,rgba(6,6,8,var(--vig)) 100%)}
.cover-ribbon{position:absolute;top:0;left:0;right:0;z-index:4;height:7.5cqw;min-height:15px;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:3.3cqw;letter-spacing:.55cqw;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.cover-text{position:absolute;z-index:5;transform:translate(-50%,-50%);pointer-events:none}

/* Gestalteter Text (Cover & Canvas): hintere Ebene = 3D-Effekt, vordere = Oberfläche */
.stx{display:inline-grid;white-space:pre;font-kerning:normal}
.stx>span{grid-area:1/1}
.stx-back{color:transparent}
.stx-front{position:relative;background-size:100% var(--lhpx,1.1em);background-repeat:repeat-y}
.foil-gold{background-image:linear-gradient(180deg,#fff4d1 0%,#e8c06a 42%,#a8772a 72%,#f3d58c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-chrome{background-image:linear-gradient(180deg,#ffffff 0%,#d3dae3 42%,#5f6c80 55%,#e6ebf1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-bronze{background-image:linear-gradient(180deg,#f7d2a8 0%,#c27a3e 48%,#6d3b17 78%,#d9935b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-crimson{background-image:linear-gradient(180deg,#ffc1b0 0%,#d9474f 52%,#6e0d12 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-patina{background-image:linear-gradient(180deg,#e8f4ec 0%,#8ccab2 48%,#2f6e5d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-ice{background-image:linear-gradient(180deg,#ffffff 0%,#bfe9ff 45%,#4a8fc4 75%,#e0f6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-ember{background-image:linear-gradient(180deg,#fff2a8 0%,#ffb03b 40%,#e2461d 75%,#7a1606 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.foil-ivory{color:#f5f0e3}
.foil-neon{color:#8ef4ff;text-shadow:0 0 .06em rgba(0,220,255,.8),.03em .03em 0 rgba(255,40,120,.8)}
.foil-plain{color:var(--plain)}
.foil-ink{color:#241d15}

/* ============================================================================
   5. DESIGNER & DIALOGE
   ============================================================================ */
.modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(10,8,6,.62);backdrop-filter:blur(5px)}
.modal.open{display:flex;animation:fadeIn .14s ease-out}
.modal.open > *{animation:popIn .18s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.975)}to{opacity:1;transform:none}}
#modal2{z-index:600} #dialog{z-index:800}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.designer{width:100%;max-width:1220px;height:min(900px,94vh);display:grid;grid-template-columns:minmax(300px,410px) 1fr;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.des-preview{background:radial-gradient(circle at 50% 40%,#1d1b18,#0b0a09);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-right:1px solid var(--line);overflow:auto}
.des-stage{position:relative;width:100%;max-width:340px;border-radius:var(--r);overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.6)}
.des-stage .cover-text{pointer-events:auto;cursor:grab;outline:none;padding:.4cqw 1cqw;touch-action:none;transition:filter .12s}
.des-stage .cover-text:hover{filter:brightness(1.08)}
.des-stage .cover-text.dragging{cursor:grabbing;filter:brightness(1.12)}
.guide-v,.guide-h{position:absolute;z-index:9;pointer-events:none;background:#ff5a8d;opacity:0}
.guide-v{top:0;bottom:0;left:50%;width:1px}
.guide-h{left:0;right:0;top:50%;height:1px}
.guide-v.on,.guide-h.on{opacity:.9}
.des-hint{font-family:var(--mono);font-size:10px;color:#8b867c;text-align:center;letter-spacing:.4px}
.des-controls{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.des-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.des-head h2,.dlg-head h2{font-family:var(--display);font-size:17px}
.des-tabs{display:flex;gap:2px;padding:6px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.des-tabs button{padding:8px 12px;border:none;border-bottom:2px solid transparent;background:none;color:var(--text-2);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.des-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.des-body{flex:1;overflow:auto;padding:16px 20px 22px;min-height:0}
.des-pane{display:none;flex-direction:column;gap:14px}
.des-pane.active{display:flex}
.des-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-shrink:0}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f-l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-2)}
.f-l output{color:var(--accent);text-transform:none;font-size:10.5px}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f-row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer;transition:transform .15s;flex-shrink:0;padding:0}
.swatch:hover{transform:scale(1.1)}
.swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--accent)}
.swatch.none{background:repeating-linear-gradient(45deg,var(--panel-2) 0 4px,var(--line-2) 4px 6px)}
.preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{aspect-ratio:2/3;border-radius:var(--r-sm);overflow:hidden;border:2px solid transparent;cursor:pointer;padding:0;background:none;position:relative}
.preset img{width:100%;height:100%;object-fit:cover;display:block}
.preset.active,.preset:hover{border-color:var(--accent)}
.preset span{position:absolute;left:0;right:0;bottom:0;padding:3px;font-size:9px;color:#eee;background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:center}
.subhead{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.style-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.style-preset{height:58px;border-radius:var(--r-sm);border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,#2a2620,#0e0d0c);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;padding:4px;container-type:inline-size}
.style-preset:hover{border-color:var(--accent)}
.style-preset .stx{font-size:19px;line-height:1}
.style-preset small{font-size:9.5px;color:#a49d8f;font-family:var(--mono)}
.font-cats{display:flex;gap:4px;flex-wrap:wrap}
.font-cats button{height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);font-size:11px;color:var(--text-2);cursor:pointer}
.font-cats button.active{border-color:var(--accent);color:var(--accent);background:var(--acc-soft)}
.font-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:228px;overflow:auto;padding:2px}
.font-chip{height:40px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);cursor:pointer;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;line-height:1}
.font-chip:hover{border-color:var(--line-2);background:var(--hover)}
.font-chip.active{border-color:var(--accent);color:var(--accent);background:var(--acc-soft)}
.note{font-size:11px;color:var(--muted)}

.dlg{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-family:var(--display);font-size:16px}
.dlg p{color:var(--text-2);white-space:pre-line}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.sheet{width:100%;max-width:880px;max-height:92vh;max-height:92dvh;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.sheet.sm{max-width:560px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.dlg-body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.set-sec{display:flex;flex-direction:column;gap:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:32px}
.set-row>span{color:var(--text-2)}
.sw-table{display:flex;flex-direction:column;gap:6px}
.sw-row{display:grid;grid-template-columns:34px 1fr 64px 1fr 30px auto auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2)}
.sw-row .inp{height:26px;font-size:11.5px}
.sw-ico-lg{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:11px;overflow:hidden}
.sw-ico-lg img{width:100%;height:100%;object-fit:contain}
.keys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.keys-group h4{font-family:var(--display);font-size:13px;margin-bottom:8px;color:var(--accent)}
.keys-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.keys-row span:first-child{color:var(--text-2)}
.keys-row span:last-child{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}

#toasts{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:990;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel-2);border:1px solid var(--line-2);color:var(--text);padding:9px 14px;border-radius:var(--r);box-shadow:var(--shadow);font-size:12.5px;display:flex;gap:8px;align-items:center;animation:toastIn .25s var(--ease)}
.toast .ic{color:var(--accent)}
.toast.err{border-color:var(--danger)} .toast.err .ic{color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================================
   6. PIPELINE
   ============================================================================ */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;display:flex;align-items:center;gap:14px;min-width:0}
.kpi-label{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;margin-top:2px}
.kpi-text{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-main{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.ring{flex-shrink:0}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease)}
.meter{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.meter>div{height:100%;background:var(--accent);border-radius:9px}
.meter.warn>div{background:var(--warn)} .meter.danger>div{background:var(--danger)}

.cd{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.cd-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.cd-soon{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.cd-today{color:#fff;background:var(--warn);border-color:var(--warn)}
.cd-overdue{color:#fff;background:var(--danger);border-color:var(--danger)}
.cd-done{color:var(--muted);background:var(--panel-2);border-color:var(--line)}
.cd-none{color:var(--muted);border-color:var(--line);border-style:dashed}

.timeline{padding:14px 16px 10px;margin-bottom:18px;overflow:hidden}
.tl-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tl-title h3{font-family:var(--display);font-size:14px}
.tl-legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.tl-legend span{display:inline-flex;align-items:center;gap:5px}
.tl-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tl-row{display:grid;grid-template-columns:210px 1fr;align-items:center;min-height:30px}
.tl-row:not(.tl-head):hover{background:color-mix(in srgb,var(--hover) 45%,transparent)}
.tl-label{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;cursor:pointer}
.tl-track{position:relative;height:30px;border-left:1px solid var(--line)}
.tl-head .tl-track{height:22px;border-bottom:1px solid var(--line)}
.tl-tick{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);font-family:var(--mono);font-size:9.5px;color:var(--muted);padding:3px 0 0 4px;white-space:nowrap}
.tl-row:not(.tl-head) .tl-tick{padding:0}
.tl-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.85;z-index:3}
.tl-today-label{position:absolute;top:2px;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--on-accent);background:var(--accent);padding:0 5px;border-radius:3px;z-index:4}
.tl-bar{position:absolute;top:8px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--accent) 20%,var(--panel-2));border:1px solid var(--acc-line);overflow:hidden;z-index:2;min-width:6px}
.tl-bar .tl-fill{height:100%;background:var(--accent);opacity:.85}
.tl-bar.cd-overdue{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 18%,var(--panel-2))}
.tl-bar.cd-done{opacity:.55}
.tl-dot{position:absolute;top:11px;width:8px;height:8px;margin-left:-4px;transform:rotate(45deg);border-radius:1px;z-index:4;background:var(--text-2);border:1px solid var(--panel)}
.tl-dot.cd-overdue{background:var(--danger)} .tl-dot.cd-soon,.tl-dot.cd-today{background:var(--warn)} .tl-dot.cd-ok{background:var(--ok)} .tl-dot.cd-done{background:var(--muted)}
.tl-empty{color:var(--muted);font-size:12px;padding:10px 0}

.phase-list{display:flex;flex-direction:column;gap:14px}
.phase{overflow:hidden;scroll-margin-top:16px}
.phase-head{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.phase-num{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--acc-line);border-radius:3px;padding:1px 6px}
.phase-title{flex:1 1 220px;min-width:160px;height:32px;padding:0 8px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;font-family:var(--display);font-size:15px;font-weight:700;outline:none}
.phase-title:hover{border-color:var(--line)}
.phase-title:focus{border-color:var(--accent);background:var(--panel-2)}
.phase-dates{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.date-field{display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2)}
.date-field span{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.date-field input,.date-in{border:none;background:transparent;font-family:var(--mono);font-size:11.5px;outline:none;height:26px;color:var(--text)}
.date-in{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);padding:0 6px;height:28px}
.date-in:focus{border-color:var(--accent)}
.phase-pct{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:40px;text-align:right}
.phase-bar{height:3px;background:var(--line)}
.phase-bar>div{height:100%;background:var(--accent);transition:width .4s var(--ease)}
.phase.collapsed .phase-body{display:none}
.phase.collapsed .chev{transform:rotate(-90deg)}
.chev{transition:transform .2s;display:inline-flex}
.phase-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.phase-meta{display:flex;align-items:center;gap:12px;padding:8px 14px 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.tool-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 4px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--panel-2);color:var(--text-2)}
.tools-input{flex:1;min-width:180px;height:24px;border:1px dashed var(--line);border-radius:999px;background:transparent;padding:0 10px;font-size:11px;color:var(--text-2);outline:none}
.tools-input:focus{border-style:solid;border-color:var(--accent)}
.task-list{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:22px 1fr auto 28px;align-items:center;gap:10px;padding:6px 8px 6px 10px;border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel-2);transition:border-color .15s}
.task:hover{border-color:var(--line-2)}
.task.p-low{border-left-color:var(--muted)} .task.p-med{border-left-color:var(--info)} .task.p-high{border-left-color:var(--warn)} .task.p-critical{border-left-color:var(--crit)}
.task.done{opacity:.55}
.task.done .task-text{text-decoration:line-through;color:var(--muted)}
.task-text{border:1px solid transparent;background:transparent;height:28px;padding:0 6px;border-radius:3px;outline:none;font-size:12.5px;min-width:0;width:100%}
.task-text:focus{border-color:var(--accent);background:var(--panel)}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.est{display:inline-flex;align-items:center;gap:2px;height:24px;border:1px solid var(--line);border-radius:999px;padding:0 7px;background:var(--panel)}
.est input{width:30px;border:none;background:transparent;font-family:var(--mono);font-size:10.5px;text-align:right;outline:none}
.est span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.prio{height:24px;padding:0 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:10.5px;font-weight:600;cursor:pointer;outline:none;text-transform:uppercase}
.prio-low{color:var(--muted)} .prio-med{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.prio-high{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.prio-critical{color:#fff;background:var(--crit);border-color:var(--crit)}
.status{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.st-wip i{background:var(--warn)} .status.st-review i{background:var(--review)} .status.st-done i{background:var(--ok)}
.task-add{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;padding:0 14px 14px}
.task-empty{color:var(--muted);font-size:12px;padding:6px 2px}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.kb-col{background:color-mix(in srgb,var(--panel) 75%,transparent);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:200px;transition:border-color .15s,background .15s}
.kb-col.drop{border-color:var(--accent);background:var(--acc-soft)}
.kb-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px}
.kb-head i{width:9px;height:9px;border-radius:50%}
.kb-head .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.kb-list{display:flex;flex-direction:column;gap:8px;padding:10px;min-height:120px}
.kb-card{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r-sm);padding:9px 10px;display:flex;flex-direction:column;gap:7px;cursor:grab;box-shadow:var(--shadow-sm);transition:transform .12s,border-color .15s}
.kb-card:hover{border-color:var(--line-2)}
.kb-card.dragging{opacity:.4}
.kb-card.p-med{border-left-color:var(--info)} .kb-card.p-high{border-left-color:var(--warn)} .kb-card.p-critical{border-left-color:var(--crit)}
.kb-card .kb-t{font-size:12.5px;font-weight:500;line-height:1.35}
.kb-card .kb-ph{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-card .kb-m{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ============================================================================
   7. DENKBRETT
   ============================================================================ */
.board-layout{display:flex;height:100%}
.board-side{width:232px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20;transition:margin .25s var(--ease)}
.board-side.hidden{margin-left:-232px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 8px;font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.side-list{list-style:none;padding:4px 8px;overflow:auto}
.side-list li{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 9px;border-radius:var(--r-sm);color:var(--text-2);cursor:pointer;font-size:12.5px;border:1px solid transparent;margin-bottom:2px}
.side-list li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.side-list li:hover{background:var(--hover);color:var(--text)}
.side-list li.active{background:var(--acc-soft);color:var(--accent);border-color:var(--acc-line);font-weight:600}
.side-list li .x{opacity:0;border:none;background:none;color:var(--muted);cursor:pointer;padding:0 2px;display:inline-flex}
.side-list li:hover .x{opacity:1}
.side-list li .x:hover{color:var(--danger)}
.side-tip{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.65}
.side-tip b{color:var(--text-2);font-weight:600}
.board-stage{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.board-side{display:none!important}
.board-toolbar{position:absolute;inset:0;pointer-events:none;z-index:26;padding:10px 12px}
.bt-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bt-pill,.bt-tools{pointer-events:auto;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.bt-pill{display:flex;align-items:center;gap:2px;padding:3px;border-radius:10px}
.bt-pill .icon-btn.sm{width:30px;height:28px;border-radius:7px}
.bt-board{display:flex;align-items:center;gap:7px;height:28px;max-width:280px;padding:0 9px 0 10px;border:none;border-radius:7px;background:transparent;color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s}
.bt-board:hover,.bt-board.open{background:var(--hover)}
.bt-board > .ic:first-child{color:var(--accent)}
.bt-board span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-board em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted)}
.bt-board em:empty{display:none}
.bt-sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.bt-tools{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:12px;transition:opacity .16s,transform .2s var(--ease)}
.bt-tools.hidden{opacity:0;transform:translate(-14px,-50%);pointer-events:none}
.bt-tool{position:relative;width:36px;height:36px;display:grid;place-items:center;border:none;border-radius:8px;background:transparent;color:var(--text-2);cursor:pointer;transition:background .12s,color .12s}
.bt-tool:hover{background:var(--hover);color:var(--text)}
.bt-tool:active{transform:scale(.94)}
.bt-tool.on{background:var(--acc-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--acc-line)}
.bt-tool::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);white-space:nowrap;padding:5px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2);box-shadow:var(--shadow-sm);color:var(--text);font-size:11.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}
.bt-tool:hover::after{opacity:1;transform:translate(0,-50%);transition-delay:.3s}
.bt-hsep{height:1px;background:var(--line);margin:3px 6px}
.viewport{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:var(--g,24px) var(--g,24px);background-position:var(--gx,0) var(--gy,0);cursor:default;touch-action:none;outline:none}
.viewport.nogrid{background-image:none}
.viewport.panning{cursor:grabbing!important}
.viewport.space{cursor:grab}
.viewport.xf{cursor:move}
.viewport.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--accent);stroke-width:2;opacity:.8}
.wire.sel{stroke-width:3;opacity:1;stroke:var(--warn)}
.wire-hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.wire-temp{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5}
.arrow-head{fill:var(--accent)}
.wire-label{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;z-index:2000;font-size:11px}
.wire-label .wl-text{background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;color:var(--text-2);cursor:text;white-space:nowrap}
.wire-label.empty .wl-text{display:none}
.wire-label button{display:none;width:20px;height:20px;border-radius:50%;border:none;background:var(--danger);color:#fff;cursor:pointer;align-items:center;justify-content:center}
.wire-label.sel .wl-text{display:inline-block;border-color:var(--warn)}
.wire-label.sel button{display:inline-flex}
.box-sel{position:absolute;display:none;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);z-index:40;pointer-events:none}
.dock-bar{position:absolute;display:none;background:var(--accent);border-radius:3px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent);z-index:3000;pointer-events:none}
.xf-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:none;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--acc-line);box-shadow:var(--shadow);font-size:11.5px;color:var(--text-2);z-index:50;white-space:nowrap}
.xf-hint.on{display:block}

.node{position:absolute;color:var(--text);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;--nacc:var(--accent)}
.node.anim{transition:left .14s ease-out,top .14s ease-out}
.node.pop{animation:nodePop .2s var(--ease)}
@keyframes nodePop{from{opacity:0;scale:.92}to{opacity:1;scale:1}}
.node.selected{border-color:color-mix(in srgb,var(--accent) 70%,var(--line-2));box-shadow:0 0 0 2px var(--acc-soft),var(--shadow)}
.node.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.node.dock-target{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent),var(--shadow)}
.node.shake-off{animation:shakeOff .35s}
@keyframes shakeOff{0%,100%{rotate:0}25%{rotate:-3deg}75%{rotate:3deg}}
.node-grip{height:21px;flex-shrink:0;display:flex;align-items:center;gap:7px;padding:0 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:move;border-bottom:1px solid var(--line);border-top:3px solid var(--nacc);border-radius:var(--r) var(--r) 0 0;touch-action:none;user-select:none}
.node-grip .gr{margin-left:auto;display:inline-flex;align-items:center;gap:3px;color:var(--accent)}
.grip-dots{width:10px;height:8px;background-image:radial-gradient(currentColor 1px,transparent 1.2px);background-size:4px 4px;opacity:.8}
.node-body{display:flex;flex-direction:column;gap:3px;padding:8px 11px 8px;flex:1;min-height:0}
.n-cat,.n-title,.n-caption{border:none;background:transparent;outline:none;width:100%}
.n-cat{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--nacc)}
.n-title{font-family:var(--display);font-size:14px;font-weight:700}
.n-desc{flex:1;min-height:40px;border:none;background:transparent;outline:none;resize:none;font-size:12px;color:var(--text-2);line-height:1.5}
.n-cat:focus,.n-title:focus,.n-desc:focus{background:var(--panel-2);border-radius:3px}
.stage-row{display:flex;align-items:center;gap:8px;padding:0 11px 8px}
.stepper{display:flex;gap:3px;flex:1}
.stepper button{flex:1;height:7px;border-radius:3px;border:none;background:var(--line);cursor:pointer;padding:0}
.stepper button.on{background:var(--nacc)}
.stepper button:hover{filter:brightness(1.25);transform:scaleY(1.4)}
.stage-name{font-family:var(--mono);font-size:9.5px;color:var(--nacc);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;min-width:54px;text-align:right}
.n-links{padding:0 11px 10px}
.node-note{background:var(--note-bg,var(--note));border-color:color-mix(in srgb,var(--note-bg,var(--note)) 70%,#000)}
.node-note .node-grip{border-top-color:transparent;border-bottom-color:rgba(0,0,0,.08);color:rgba(40,32,20,.55)}
html[data-mode="dark"] .node-note .node-grip{color:rgba(255,245,220,.45)}
.n-note{flex:1;border:none;background:transparent;outline:none;resize:none;padding:8px 12px 12px;font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--note-ink,var(--text))}
.node-image{background:#0b0b0d;border-color:#2a2a30}
.node-image .node-grip{background:#141417;color:#8a867d;border-bottom-color:#26262b}
.node-img{flex:1;min-height:0;cursor:move;touch-action:none}
.node-img img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.n-caption{height:22px;text-align:center;font-family:var(--mono);font-size:10px;color:#a29d93;flex-shrink:0}
.node-text{background:transparent;border:1px dashed transparent;box-shadow:none;width:auto!important;height:auto!important}
.node-text:hover{border-color:var(--line-2)}
.node-text.selected,.node-text.active{border-color:var(--accent);box-shadow:none}
.node-text .node-grip{position:absolute;top:-24px;left:-1px;height:22px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel);opacity:0;transition:opacity .15s;white-space:nowrap}
.node-text:hover .node-grip,.node-text.selected .node-grip{opacity:1}
.n-textview{padding:6px 10px;cursor:move;min-width:40px;min-height:24px}
.n-textedit{display:block;border:none;outline:none;resize:none;background:color-mix(in srgb,var(--panel) 60%,transparent);padding:6px 10px;white-space:pre;overflow:hidden;field-sizing:content;min-width:120px;min-height:1.2em}
.node.docked{outline:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.dock-pin{position:absolute;top:-9px;left:-9px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;z-index:9;box-shadow:var(--shadow-sm)}
.port{position:absolute;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);z-index:6;transition:transform .15s,background .15s}
.port-in{left:-7px;pointer-events:none;opacity:.6}
.port-out{right:-7px;cursor:crosshair}
.port-out:hover{transform:scale(1.35);background:var(--accent)}
.node-text .port,.node.docked .port{opacity:0}
.node-text:hover .port-out,.node-text.selected .port-out{opacity:1}
.node-resize{position:absolute;right:1px;bottom:1px;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,var(--accent) 55%);opacity:.55;border-radius:0 0 var(--r) 0;touch-action:none}
.node-del{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;border:none;background:var(--danger);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:8}
.node.active .node-del{display:flex}

.node-inspector{position:absolute;top:58px;right:12px;width:290px;max-height:calc(100% - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px;display:none;flex-direction:column;gap:11px;z-index:30}
.node-inspector.open{display:flex}
.insp-head{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent)}
.insp-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.insp-info{font-size:11.5px;color:var(--text-2);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;display:flex;align-items:center;gap:8px}
.zoom-hud{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);z-index:25}
.zoom-hud .zv{min-width:52px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text-2);cursor:pointer;border:none;background:none;height:26px}

/* Software-Badges */
.sw-links{display:flex;flex-direction:column;gap:5px}
.sw-link{display:flex;align-items:center;gap:5px;min-width:0}
.sw-badge{display:inline-flex;align-items:center;gap:0;height:24px;border-radius:5px;overflow:hidden;border:1px solid color-mix(in srgb,var(--sw) 50%,transparent);background:color-mix(in srgb,var(--sw) 9%,var(--panel-2));cursor:pointer;padding:0;flex-shrink:0;transition:transform .12s,box-shadow .12s;position:relative}
.sw-badge:hover{transform:translateY(-1px);box-shadow:0 3px 10px color-mix(in srgb,var(--sw) 30%,transparent)}
.sw-badge.missing::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.sw-code{display:flex;align-items:center;justify-content:center;min-width:24px;height:100%;padding:0 5px;background:var(--sw);color:var(--swt);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.2px}
.sw-img{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--sw) 14%,transparent)}
.sw-img img{width:18px;height:18px;object-fit:contain}
.sw-name{display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:600;color:var(--text)}
.sw-mini{display:inline-flex;width:18px;height:18px;border-radius:4px;align-items:center;justify-content:center;font-family:var(--mono);font-size:8.5px;font-weight:700;overflow:hidden;flex-shrink:0}
.sw-mini img{width:16px;height:16px;object-fit:contain}
.sw-path{flex:1;min-width:0;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sw-path:hover{color:var(--text-2)}
.sw-add{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px;margin-top:3px}
.sw-add .sel,.sw-add .inp{height:26px;font-size:11px}
.sw-add .sel{max-width:112px}

/* ============================================================================
   8. SHOTLIST
   ============================================================================ */
.table-wrap{overflow-x:auto}
.shot-table{width:100%;border-collapse:collapse;min-width:1100px}
.shot-table th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:10px 12px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.shot-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.shot-table tr:hover td{background:color-mix(in srgb,var(--hover) 45%,transparent)}
.shot-table .inp{width:100%}
.thumb{width:96px;height:54px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:10px;gap:4px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb:hover{border-color:var(--accent)}
.dept{display:flex;gap:4px}
.dept button{height:24px;padding:0 7px;border-radius:3px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);font-family:var(--mono);font-size:10px;font-weight:600;cursor:pointer}
.dept .st-wip{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.dept .st-done{background:color-mix(in srgb,var(--ok) 17%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

/* ============================================================================
   9. STORY & LORE
   ============================================================================ */
.story{display:grid;grid-template-columns:250px 1fr 340px;height:100%}
.story.focus{grid-template-columns:0 1fr 0}
.story.focus .story-nav,.story.focus .story-insp{overflow:hidden;border:none;padding:0}
.story-nav{background:var(--bg-2);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.story-center{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.story-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.paper-scroll{flex:1;overflow:auto;padding:30px 20px 60px;display:flex;justify-content:center}
.paper{width:100%;max-width:780px;background:var(--paper);color:var(--paper-text);border:1px solid var(--line);box-shadow:var(--shadow);padding:56px 66px;border-radius:2px;display:flex;flex-direction:column;gap:16px;height:fit-content;min-height:100%;position:relative}
html[data-mode="light"] .paper{background:linear-gradient(180deg,#ebe2cf,#e5dbc6);box-shadow:0 1px 0 #f3ead8 inset,var(--shadow)}
.paper-title{font-family:var(--display);font-size:24px;font-weight:700;border:none;border-bottom:1px solid var(--acc-line);background:transparent;padding-bottom:10px;outline:none;color:inherit}
.paper-body{font-family:var(--serif);font-size:19px;line-height:1.75;border:none;background:transparent;outline:none;resize:none;min-height:55vh;overflow:hidden;color:inherit}
.paper-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.lore-pill{color:var(--accent);border:1px solid var(--acc-line);background:var(--acc-soft);border-radius:999px;padding:1px 9px;cursor:pointer;font-weight:600;font-size:11.5px}
.story-insp{background:var(--bg-2);border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.insp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:11px}

/* ============================================================================
   10. ANLEITUNG
   ============================================================================ */
.guide{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start}
.guide-toc{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel)}
.guide-toc button{text-align:left;border:none;background:none;padding:6px 9px;border-radius:var(--r-sm);color:var(--text-2);cursor:pointer;font-size:12.5px}
.guide-toc button:hover{background:var(--hover);color:var(--text)}
.guide-body{display:flex;flex-direction:column;gap:16px;min-width:0}
.gsec{padding:22px 26px;scroll-margin-top:16px}
.gsec h2{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gsec h2 .gi{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:var(--acc-soft);color:var(--accent);border:1px solid var(--acc-line);flex-shrink:0}
.gsec h3{font-size:13.5px;margin:14px 0 6px;color:var(--text)}
.gsec p,.gsec li{color:var(--text-2);line-height:1.65}
.gsec ul,.gsec ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.gsec .tip{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--acc-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--text-2);font-size:12.5px}
.gsec table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.gsec td,.gsec th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;color:var(--text-2);vertical-align:top}
.gsec th{font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.flow span.st{padding:4px 10px;border-radius:99px;border:1px solid var(--acc-line);background:var(--acc-soft);font-size:11.5px;color:var(--text)}

/* ============================================================================
   11. RESPONSIVE
   ============================================================================ */
.only-sm{display:none}
@media (max-width:1380px){ .tabs button:not(.active) span{display:none} .tabs button{padding:0 10px} }
@media (max-width:1100px){ .proj-crumb{max-width:150px} }
@media (max-width:1240px){
  .story{grid-template-columns:220px 1fr;grid-template-rows:1fr auto;overflow:auto}
  .story-insp{grid-column:1/-1;border-left:none;border-top:1px solid var(--line)}
  .kanban{grid-template-columns:repeat(4,260px)}
}
@media (max-width:900px){
  .designer{grid-template-columns:1fr;height:auto;max-height:94dvh;overflow:auto}
  .des-controls{overflow:visible}
  .des-body{overflow:visible}
  .des-preview{border-right:none;border-bottom:1px solid var(--line);padding:16px}
  .des-stage{max-width:230px}
  .board-side{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow)}
  .only-sm{display:inline-flex}
  .story{display:flex;flex-direction:column;overflow:auto}
  .story-nav{border-right:none;border-bottom:1px solid var(--line)}
  .story-nav .side-list{max-height:170px}
  .story-center{overflow:visible}
  .paper-scroll{overflow:visible;padding:16px 10px 30px}
  .paper{padding:28px 22px}
  .tl-row{grid-template-columns:110px 1fr}
  .guide{grid-template-columns:1fr}
  .guide-toc{position:static;flex-direction:row;flex-wrap:wrap}
  .menubar{display:none}
  .statusbar .sb-hints{display:none}
  .sw-row{grid-template-columns:34px 1fr 54px 30px auto;}
  .sw-row .hide-sm{display:none}
}
@media (max-width:640px){
  html,body{font-size:13.5px}
  .topbar{grid-template-columns:minmax(0,1fr) auto;height:auto;row-gap:6px;padding:6px 0 6px 8px}
  .tabs{grid-column:1/-1;grid-row:2;margin-right:8px;justify-self:stretch}
  .tabs button{flex:1;justify-content:center}
  .proj-crumb{max-width:none;flex:1}
  .brand-sub,.hide-sm{display:none}
  .brand{padding-right:0}
  .page{padding:18px 14px 50px}
  .page-title{font-size:20px}
  .head-actions{width:100%}
  .search .inp{width:100%}
  .search{flex:1}
  .mini-range{flex:1}
  .mini-range input[type=range]{width:100%}
  .hub-grid{grid-template-columns:repeat(2,1fr)!important;gap:18px 12px}
  .f-row,.f-row3,.f-row4{grid-template-columns:1fr 1fr}
  .preset-grid{grid-template-columns:repeat(3,1fr)}
  .task{grid-template-columns:22px 1fr 28px}
  .task .task-meta{grid-column:1/-1;justify-content:flex-start;padding-left:30px}
  .task-add{grid-template-columns:1fr 1fr}
  .task-add .inp:first-child{grid-column:1/-1}
  .node-inspector{left:12px;right:12px;width:auto;top:auto;bottom:56px;max-height:46%}
  .statusbar{display:none}
}
@media (hover:none){
  .pcard-actions{opacity:1;transform:none}
  .node.selected .node-del{display:flex}
  .node-text .node-grip{opacity:1}
}
/* UI-Zoom-Anzeige */
.zoom-pill{position:fixed;left:50%;top:64px;z-index:1200;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line-2);box-shadow:var(--shadow);color:var(--text);font-size:12px;pointer-events:none;opacity:0;transform:translate(-50%,-6px);transition:opacity .14s,transform .14s var(--ease)}
.zoom-pill.show{opacity:1;transform:translate(-50%,0)}
.zoom-pill b{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:46px;text-align:center}
.zoom-pill span{color:var(--muted);font-size:11px}
.zoom-pill kbd{font-size:10px}

/* Geführte Tour */
.tour{position:fixed;inset:0;z-index:2000;opacity:0;transition:opacity .16s ease-out}
.tour.open{opacity:1}
.tour-block{position:absolute;inset:0;cursor:default}
.tour-spot{position:absolute;border-radius:12px;box-shadow:0 0 0 2px var(--accent),0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),0 0 0 200vmax rgba(8,6,4,.62);pointer-events:none;transition:left .26s var(--ease),top .26s var(--ease),width .26s var(--ease),height .26s var(--ease)}
:root[data-mode="light"] .tour-spot{box-shadow:0 0 0 2px var(--accent),0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),0 0 0 200vmax rgba(48,36,20,.45)}
.tour-card{position:absolute;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(0,0,0,.45);padding:16px 18px 14px;color:var(--text);transition:left .26s var(--ease),top .26s var(--ease)}
.tour-card.swap > *{animation:tourSwap .2s var(--ease)}
@keyframes tourSwap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tour-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tour-step{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--accent)}
.tour-x{width:26px;height:26px;display:grid;place-items:center;border:none;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.tour-x:hover{background:var(--hover);color:var(--text)}
.tour-card h3{margin:0 0 6px;font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.2px}
.tour-card p{margin:0;font-size:13px;line-height:1.55;color:var(--text-2)}
.tour-card p b{color:var(--text)}
.tour-card kbd{font-size:10.5px}
.tour-langs{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.tour-langs button{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text-2);font-size:11.5px;cursor:pointer;transition:all .12s}
.tour-langs button:hover{border-color:var(--line-2);color:var(--text)}
.tour-langs button.on{border-color:var(--acc-line);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tour-dots{display:flex;gap:4px;margin:14px 0 12px;flex-wrap:wrap}
.tour-dots button{width:7px;height:7px;padding:0;border:none;border-radius:999px;background:var(--line-2);cursor:pointer;transition:width .2s var(--ease),background .15s}
.tour-dots button.past{background:color-mix(in srgb,var(--accent) 45%,var(--line-2))}
.tour-dots button.on{width:20px;background:var(--accent)}
.tour-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour-foot [data-tour=back] svg{transform:rotate(180deg)}
.tour-foot kbd{font-size:10px;margin-left:2px;background:rgba(0,0,0,.15);border-color:transparent;color:inherit}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kompakte Stil-Vorlagen im Denkbrett-Inspector */
.node-inspector .style-presets{grid-template-columns:repeat(3,1fr);gap:5px}
.node-inspector .style-preset{height:40px;padding:2px}
.node-inspector .style-preset .stx{font-size:12px!important}
.node-inspector .style-preset small{font-size:8px}
.node-inspector .f-row4{grid-template-columns:1fr 1fr}
.n-links .sw-add .sel{max-width:78px}
.kpi .inline .mono{white-space:nowrap}
@media (max-width:640px){ .head-actions .search{flex-basis:100%} }

/* Verbindungs-Endpunkte (ziehen = umhängen / trennen), Schnittlinie, Ziel-Hervorhebung */
.wire-end{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);cursor:grab;z-index:2100;opacity:.0;transition:opacity .1s,transform .1s}
.viewport:hover .wire-end,.wire-end.sel{opacity:.9}
.wire-end:hover{transform:scale(1.4);background:var(--accent);opacity:1}
.wire.hidden{opacity:.15}
.cut-line{fill:none;stroke:var(--danger);stroke-width:2;stroke-dasharray:5 4}
.node.wire-target{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent),var(--shadow)}
.node.wire-target .port-in{opacity:1;background:var(--accent);transform:scale(1.4)}

/* Shotlist: Griff zum Umsortieren */
.shot-table td.sh-end{white-space:nowrap;text-align:right;padding-right:4px}
.sh-grip{display:inline-grid;place-items:center;width:24px;height:44px;margin-left:4px;vertical-align:middle;color:var(--muted);cursor:grab;border-radius:6px;opacity:.5;transition:opacity .12s,background .12s,color .12s;touch-action:none}
.shot-table tr:hover .sh-grip{opacity:1}
.sh-grip:hover{background:var(--hover);color:var(--text)}
.sh-sorting tr{transition:transform .17s var(--ease)}
.sh-sorting tr.sh-dragging{transition:none;position:relative;z-index:5;box-shadow:var(--shadow)}
.sh-sorting tr.sh-dragging td{background:var(--panel-2)}
.sh-sorting tr:hover td{background:transparent}
.sh-dropped td{animation:shDrop .6s ease-out}
@keyframes shDrop{from{background:var(--acc-soft)}}
body.grabbing,body.grabbing *{cursor:grabbing!important}

/* Versionen */
.sheet.ver-sheet{max-width:720px}
.ver-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ver-bar kbd{font-size:9.5px;margin-left:4px;background:rgba(0,0,0,.14);border-color:transparent;color:inherit}
.ver-list{padding:4px 12px 16px!important;max-height:62vh;overflow:auto}
.ver-day{position:sticky;top:0;z-index:1;background:var(--panel);font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.ver-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px;border-radius:8px;transition:background .1s}
.ver-row:hover{background:var(--hover)}
.ver-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--bg-2);color:var(--text-2)}
.k-manual .ver-ic{background:var(--acc-soft);color:var(--accent)}
.k-file .ver-ic{color:var(--ok)}
.k-safety .ver-ic{color:var(--warn)}
.ver-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ver-pin{color:var(--accent)}
.ver-meta{display:flex;gap:10px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;margin-top:1px}
.ver-row .btn-xs{opacity:0;transition:opacity .12s}
.ver-row:hover .btn-xs,.ver-row:focus-within .btn-xs{opacity:1}
.ver-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:44px 20px;color:var(--muted);text-align:center}
.ver-empty b{color:var(--text)}
@media (hover:none){ .ver-row .btn-xs{opacity:1} .sh-grip{opacity:1} }

/* ============================================================================
   DENKBRETT-DESIGNS: Hintergründe (bewegen & zoomen mit) und Knoten-Stile
   ============================================================================ */

  background-size:calc(var(--g,24px)*5) calc(var(--g,24px)*5),calc(var(--g,24px)*5) calc(var(--g,24px)*5),var(--g,24px) var(--g,24px),var(--g,24px) var(--g,24px)}

  background-size:calc(var(--g,24px)*.29) calc(var(--g,24px)*.31),calc(var(--g,24px)*.47) calc(var(--g,24px)*.43),calc(var(--g,24px)*.83) calc(var(--g,24px)*.79),calc(var(--g,24px)*1.9) calc(var(--g,24px)*1.7);
  box-shadow:inset 0 0 120px rgba(40,20,5,.45)}

  background-image:linear-gradient(rgba(220,235,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(220,235,255,.22) 1px,transparent 1px),linear-gradient(rgba(220,235,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(220,235,255,.08) 1px,transparent 1px);
  background-size:calc(var(--g,24px)*5) calc(var(--g,24px)*5),calc(var(--g,24px)*5) calc(var(--g,24px)*5),var(--g,24px) var(--g,24px),var(--g,24px) var(--g,24px);box-shadow:inset 0 0 160px rgba(5,20,45,.5)}
.viewport.bg-paper{background-color:#efe7d5;
  background-image:linear-gradient(transparent calc(var(--g,24px) - 1px),rgba(70,105,160,.22) 1px),radial-gradient(rgba(120,95,60,.07) 1px,transparent 1.5px);
  background-size:100% var(--g,24px),calc(var(--g,24px)*.37) calc(var(--g,24px)*.41);box-shadow:inset 0 0 100px rgba(120,90,40,.18)}
