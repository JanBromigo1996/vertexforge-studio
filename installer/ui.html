<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>VertexForge Studio Setup</title>
<style>
:root{
  --bg:#151418; --panel:#1c1b20; --panel-2:#24232a; --line:#2e2d34; --line-2:#3e3c45;
  --text:#ece6da; --text-2:#aaa397; --muted:#7a746c; --gold:#d8b56c; --gold-2:#a77c34; --ok:#6fae7c; --danger:#d0574b;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:300px 1fr;height:100%;border:1px solid #2a2930}
/* Linke Bühne */
.art{position:relative;overflow:hidden;padding:34px 30px 26px;display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 30% 0%,rgba(216,181,108,.20),transparent 60%),radial-gradient(90% 60% at 100% 100%,rgba(120,90,40,.18),transparent 60%),linear-gradient(170deg,#1d1a15,#0f0e11 70%)}
.art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(216,181,108,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(216,181,108,.06) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 85%)}
.art > *{position:relative}
.logo{width:68px;height:68px;border-radius:17px;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(216,181,108,.25);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.brand{margin-top:22px;font-family:Georgia,"Times New Roman",serif;font-size:25px;letter-spacing:1.2px;line-height:1.1;color:#e9bb5c}
.tag{margin-top:6px;font-family:Consolas,monospace;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#9b8a6a}
.feats{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.feat{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.feat i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:rgba(216,181,108,.10);color:var(--gold);border:1px solid rgba(216,181,108,.18)}
.feat b{display:block;font-weight:600;font-size:12.5px}
.feat span{color:var(--text-2);font-size:11.5px}
.art-foot{margin-top:auto;color:var(--muted);font-size:11px;font-family:Consolas,monospace}
/* Rechte Seite */
.main{display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.titlebar{height:40px;display:flex;align-items:center;justify-content:space-between;padding-left:22px;flex-shrink:0}
.steps{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.steps span{display:flex;align-items:center;gap:6px;transition:color .2s}
.steps span::before{content:attr(data-n);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-size:10px;font-family:Consolas,monospace;transition:all .25s var(--ease)}
.steps span.on{color:var(--text)}
.steps span:not(.on){font-size:0;gap:0}
.steps span::before{font-size:10px}
.steps span.on::before{background:var(--gold);border-color:var(--gold);color:#1a150c}
.steps span.done::before{content:"✓";background:transparent;border-color:var(--gold-2);color:var(--gold)}
.steps em{width:16px;height:1px;background:var(--line-2)}
.wc{display:flex;align-self:stretch}
.wc button{width:46px;border:none;background:transparent;display:grid;place-items:center;color:var(--text-2);transition:background .1s}
.wc button:hover{background:#2c2b31;color:var(--text)}
.wc button.x:hover{background:#c42b1c;color:#fff}
.pages{position:relative;flex:1;overflow:hidden}
.page{position:absolute;inset:0;padding:26px 34px 0;display:flex;flex-direction:column;opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .22s var(--ease),transform .26s var(--ease)}
.page.on{opacity:1;transform:none;pointer-events:auto}
.page.past{transform:translateX(-30px)}
h1{font-family:Georgia,serif;font-weight:400;font-size:26px;letter-spacing:.3px;margin-bottom:10px}
p.lead{color:var(--text-2);font-size:13.5px;max-width:420px}
.note{margin-top:18px;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-2);font-size:12px;max-width:440px}
.note b{color:var(--text);font-weight:600}
.note.warn{border-color:rgba(208,87,75,.35);background:rgba(208,87,75,.08)}
.field{margin-top:6px}
.label{font-family:Consolas,monospace;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.path{display:flex;gap:8px}
.path input{flex:1;min-width:0;height:34px;padding:0 11px;border-radius:7px;border:1px solid var(--line-2);background:#141317;color:var(--text);font:12px Consolas,monospace;outline:none;transition:border-color .15s}
.path input:focus{border-color:var(--gold)}
.opt{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-of-type{border-bottom:none}
.opt div{flex:1}
.opt b{display:block;font-weight:600;font-size:12.5px}
.opt span{color:var(--muted);font-size:11.5px}
.sw{position:relative;width:36px;height:20px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;pointer-events:none;border-radius:99px;background:var(--line-2);transition:background .2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#eee6d6;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s var(--ease)}
.sw input:checked + i{background:var(--gold)}
.sw input:checked + i::after{transform:translateX(16px)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:16px 0 20px;border-top:1px solid var(--line)}
.foot .r{display:flex;gap:8px}
.btn{height:34px;padding:0 16px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel-2);font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .12s,filter .12s,transform .08s}
.btn:hover{background:#2d2c33}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#e2c27e,#c99f52);border-color:#c99f52;color:#1b160d;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus{outline:none}
.btn:focus-visible{outline:2px solid rgba(216,181,108,.55);outline-offset:2px}
.bar{margin-top:26px;height:8px;border-radius:99px;background:#141317;border:1px solid var(--line);overflow:hidden}
.bar div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a77c34,#e8c983,#a77c34);background-size:200% 100%;animation:sheen 1.4s linear infinite;transition:width .25s var(--ease)}
@keyframes sheen{to{background-position:-200% 0}}
.pct{margin-top:8px;font-family:Consolas,monospace;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.tasks{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:10px;color:var(--muted);transition:color .2s}
.task i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:10px;transition:all .25s var(--ease)}
.task.run{color:var(--text)}
.task.run i{border-color:var(--gold);border-top-color:transparent;animation:spin .7s linear infinite}
.task.ok{color:var(--text-2)}
.task.ok i{border-color:var(--ok);background:var(--ok);color:#10200f}
.task.ok i::after{content:"✓"}
@keyframes spin{to{transform:rotate(360deg)}}
.done-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(111,174,124,.12);border:1px solid rgba(111,174,124,.35);margin-bottom:18px}
.done-ic svg path{stroke-dasharray:30;stroke-dashoffset:30}
.page.on .done-ic svg path{animation:draw .5s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.note.soft{margin-top:10px;background:transparent;border-style:dashed;color:var(--muted)}
.langs{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:440px}
.lang{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s,transform .1s}
.lang:hover{border-color:#5a5660}
.lang:active{transform:scale(.98)}
.lang .lk{font-family:Consolas,monospace;font-size:10px;color:var(--muted);width:20px}
.lang i{margin-left:auto;font-style:normal;color:var(--gold);opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.lang.on{border-color:var(--gold);background:rgba(216,181,108,.08)}
.lang.on i{opacity:1;transform:none}
.mini-langs{margin-top:14px;display:flex;gap:4px}
.mini-langs button{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font:11px Consolas,monospace;cursor:pointer}
.mini-langs button.on{border-color:var(--gold);color:var(--gold)}
.page.instant{transition:none}
.err{margin-top:16px;color:#f0a59c;font-size:12px;display:none}
.err.on{display:block}
a{color:var(--gold);cursor:pointer;text-decoration:none}
</style>
</head>

};
let lang = 'en', L = I18N.en;
function setLang(l){ lang = I18N[l] ? l : 'en'; L = I18N[lang]; document.documentElement.lang = lang; document.querySelectorAll('[data-t]').forEach(e=>e.textContent = L[e.dataset.t]); }
const $ = id => document.getElementById(id);
let info = {mode:'install', dir:'', existing:false, sizeMB:6, version:''}, step = 0, busy = false;

/* Titelleiste ziehen */
let armed = null;
$('tb').addEventListener('pointerdown', e=>{ if(!e.target.closest('button')) armed = {x:e.clientX, y:e.clientY}; });
$('tb').addEventListener('pointermove', e=>{ if(armed && e.buttons===1 && Math.hypot(e.clientX-armed.x, e.clientY-armed.y) > 2){ armed = null; setupWin('drag'); } });
addEventListener('pointerup', ()=>armed = null);
$('xBtn').onclick = () => { if(!busy) setupWin('close'); };
addEventListener('contextmenu', e=>e.preventDefault());
addEventListener('keydown', e=>{
  if(e.key==='Escape' && !busy && step < pagesCount()-1) setupWin('close');
  if(e.key==='Enter'){ const b = document.querySelector('.page.on .btn.primary, .page.on .btn.danger'); if(b && document.activeElement.tagName!=='INPUT') b.click(); }
  if(step===0 && info.mode!=='uninstall' && (e.key==='ArrowDown' || e.key==='ArrowUp')){ e.preventDefault(); const i = LANGS.findIndex(x=>x[0]===lang), j = (i + (e.key==='ArrowDown'?1:-1) + LANGS.length) % LANGS.length; pickLang(LANGS[j][0]); }
});

function pagesCount(){ return document.querySelectorAll('.page').length; }
function show(i){
  step = i;
  document.querySelectorAll('.page').forEach((p,j)=>{ p.classList.toggle('on', j===i); p.classList.toggle('past', j<i); });
  document.querySelectorAll('#steps span').forEach((s,j)=>{ s.classList.toggle('on', j===i); s.classList.toggle('done', j<i); });
  setTimeout(()=>{ const b = document.querySelector('.page.on .btn.primary, .page.on .btn.danger'); if(b) b.focus(); }, 60);
}
const check = (id, title, desc, on) => `<label class="opt"><div><b>${title}</b><span>${desc}</span></div><span class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><i></i></span></label>`;
const task = (id, label) => `<div class="task" id="${id}"><i></i><span>${label}</span></div>`;
const doneIcon = `<div class="done-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6fae7c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>`;
/* Sprachwahl: Assistent wird sofort in der gewählten Sprache neu aufgebaut */
function pickLang(l){
  const keep = {dir:$('dir') && $('dir').value, desk:$('optDesk') && $('optDesk').checked, start:$('optStart') && $('optStart').checked};
  setLang(l); info.mode==='uninstall' ? buildUninstall() : buildInstall();
  if(keep.dir) $('dir').value = keep.dir;
  if($('optDesk') && keep.desk!=null){ $('optDesk').checked = keep.desk; $('optStart').checked = keep.start; }
  document.querySelectorAll('.page').forEach((p,j)=>{ p.classList.add('instant'); p.classList.toggle('on', j===step); p.classList.toggle('past', j<step); });
  requestAnimationFrame(()=>document.querySelectorAll('.page.instant').forEach(p=>p.classList.remove('instant')));
  document.querySelectorAll('#steps span').forEach((s,j)=>{ s.classList.toggle('on', j===step); s.classList.toggle('done', j<step); });
}
const langList = () => `<div class="langs">${LANGS.map(([k,n])=>`<button class="lang ${k===lang?'on':''}" onclick="pickLang('${k}')"><span class="lk">${k.toUpperCase()}</span>${n}<i>✓</i></button>`).join('')}</div>`;

function buildInstall(){
  $('steps').innerHTML = [L.s0,L.s1,L.s2,L.s3,L.s4].map((s,i)=>`${i?'<em></em>':''}<span data-n="${i+1}">${s}</span>`).join('');
  $('pages').innerHTML = `
  <section class="page"><h1>${L.lTitle}</h1><p class="lead">${L.lText}</p>${langList()}
    <div class="foot"><button class="btn ghost" onclick="setupWin('close')">${L.cancel}</button><div class="r"><button class="btn primary" onclick="show(1)">${L.next} →</button></div></div></section>
  <section class="page"><h1>${L.wTitle}</h1><p class="lead">${L.wText}</p>
    <div class="note">${info.existing ? L.wUpd : L.wNew}</div>
    <div class="note soft">${L.noAi}</div>
    <div class="foot"><button class="btn ghost" onclick="show(0)">← ${L.back}</button><div class="r"><button class="btn primary" onclick="show(2)">${L.next} →</button></div></div></section>
  <section class="page"><h1>${L.oTitle}</h1>
    <div class="field"><div class="label">${L.target}</div><div class="path"><input id="dir" spellcheck="false" value=""><button class="btn" id="browse">${L.browse}</button></div></div>
    <div style="margin-top:16px">${check('optDesk', L.desk, L.deskD, true)}${check('optStart', L.start, L.startD, true)}</div>
    <div class="pct" style="margin-top:6px"><span>${L.space.replace('{mb}', Math.ceil(info.sizeMB*2))}</span></div>
    <div class="foot"><button class="btn ghost" onclick="show(1)">← ${L.back}</button><div class="r"><button class="btn primary" id="goInstall"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>${info.existing ? L.update : L.install}</button></div></div></section>
  <section class="page"><h1>${info.existing ? L.iUpd : L.iTitle}</h1>
    <div class="bar"><div id="bar"></div></div><div class="pct"><span id="pctLabel"></span><span id="pct">0 %</span></div>
    <div class="tasks">${task('t-files', L.tFiles)}${task('t-shortcuts', L.tShort)}${task('t-register', L.tReg)}</div>
    <div class="err" id="err"></div>
    <div class="foot"><span></span><div class="r"><button class="btn" id="retry" style="display:none" onclick="show(2)">← ${L.back}</button></div></div></section>
  <section class="page">${doneIcon}<h1>${L.dTitle}</h1><p class="lead">${L.dText}</p>
    <div style="margin-top:18px;max-width:440px">${check('optLaunch', L.launch, L.launchD, true)}</div>
    <div class="foot"><span></span><div class="r"><button class="btn primary" id="finish">${L.finish}</button></div></div></section>`;
  $('dir').value = info.dir;
  $('browse').onclick = () => setupBrowse(L.target);
  window.onBrowse = p => { if(p) $('dir').value = p; };
  $('goInstall').onclick = startInstall;
  $('finish').onclick = () => { if($('optLaunch').checked) setupLaunch($('dir').value); setTimeout(()=>setupWin('close'), 150); };
}
function buildUninstall(){
  $('steps').innerHTML = [L.u1,L.u2,L.u3].map((s,i)=>`${i?'<em></em>':''}<span data-n="${i+1}">${s}</span>`).join('');
  $('pages').innerHTML = `
  <section class="page"><h1>${L.uTitle}</h1><p class="lead">${L.uText}</p>
    <div style="margin-top:16px;max-width:460px">${check('optData', L.uData, L.uDataD, false)}</div>
    <div class="mini-langs">${LANGS.map(([k])=>`<button class="${k===lang?'on':''}" onclick="pickLang('${k}')">${k.toUpperCase()}</button>`).join('')}</div>
    <div class="foot"><button class="btn ghost" onclick="setupWin('close')">${L.cancel}</button><div class="r"><button class="btn danger" id="goRemove">${L.remove}</button></div></div></section>
  <section class="page"><h1>${L.rTitle}</h1>
    <div class="bar"><div id="bar"></div></div><div class="pct"><span id="pctLabel"></span><span id="pct">0 %</span></div>
    <div class="tasks">${task('t-shortcuts', L.tShort)}${task('t-files', L.tFiles)}${task('t-register', L.tReg)}${task('t-data', L.tData)}</div>
    <div class="err" id="err"></div><div class="foot"><span></span><div class="r"><button class="btn" id="retry" style="display:none" onclick="show(0)">← ${L.back}</button></div></div></section>
  <section class="page">${doneIcon}<h1>${L.rdTitle}</h1><p class="lead">${L.rdText}</p>
    <div class="foot"><span></span><div class="r"><button class="btn primary" onclick="setupWin('close')">${L.close}</button></div></div></section>`;
  $('optData').onchange = e => e.target.closest('.opt').parentElement.classList.toggle('note', e.target.checked);
  $('goRemove').onclick = () => { busy = true; show(1); if(!$('optData').checked) $('t-data').style.display = 'none'; setupUninstall($('optData').checked); };
}
function startInstall(){
  busy = true; $('err').classList.remove('on'); $('retry').style.display = 'none';
  document.querySelectorAll('.task').forEach(t=>t.className = 'task');
  show(3);
  setupInstall({dir:$('dir').value, desktop:$('optDesk').checked, startMenu:$('optStart').checked, lang});
}
const ORDER = ['files','shortcuts','register','data'];
window.onProgress = (p, s) => {
  $('bar').style.width = Math.round(p*100) + '%'; $('pct').textContent = Math.round(p*100) + ' %';
  const i = ORDER.indexOf(s);
  ORDER.forEach((k,j)=>{ const el = $('t-'+k); if(!el) return; el.className = 'task' + (s==='done' || j < i ? ' ok' : j===i ? ' run' : ''); });
};
window.onDone = () => { busy = false; setTimeout(()=>show(info.mode==='uninstall' ? 2 : 4), 380); };
window.onError = msg => { busy = false; const e = $('err'); e.textContent = msg==='running' ? L.running : L.fail + msg; e.classList.add('on'); $('retry').style.display = ''; document.querySelectorAll('.task.run').forEach(t=>t.className = 'task'); };

(async ()=>{
  try{ info = await setupInfo(); }catch(e){}
  setLang(I18N[info.lang] ? info.lang : 'en');
  $('logo').src = info.logo || ''; $('ver').textContent = 'Version ' + (info.version || '');
  info.mode==='uninstall' ? buildUninstall() : buildInstall();
  requestAnimationFrame(()=>show(0));
})();
</script>
</body>
</html>
